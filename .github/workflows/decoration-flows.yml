name: Decoration Owner and Customer validation

on:
  pull_request:
    paths:
      - 'lib/features/events/decoration_*'
      - 'lib/features/events/event_service_browser.dart'
      - 'lib/features/events/event_service_catalogue_screen.dart'
      - 'lib/features/events/event_interest_customize_screen.dart'
      - 'lib/features/business/business_unit_dashboard.dart'
      - 'backend_rust/src/events/catalogues.rs'
      - 'backend_rust/src/events/mod.rs'
      - 'test/features/events/decoration_*'
      - '.github/workflows/decoration-flows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter Decoration Owner and Customer
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze Decoration screens and contracts
        run: |
          flutter analyze --no-fatal-infos \
            lib/features/events/decoration_entry_screen.dart \
            lib/features/events/decoration_price_math.dart \
            lib/features/events/event_service_catalogue_screen.dart \
            lib/features/events/event_service_browser.dart \
            lib/features/events/event_interest_customize_screen.dart \
            lib/features/business/business_unit_dashboard.dart \
            test/features/events/decoration_owner_flow_test.dart
      - name: Test Decoration entry and save paths
        run: flutter test --no-pub test/features/events/decoration_owner_flow_test.dart

  rust:
    name: Rust Decoration catalogue, selection and customization
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend_rust
      - run: cargo check --manifest-path backend_rust/Cargo.toml
      - run: cargo test --manifest-path backend_rust/Cargo.toml decoration
