server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve Angular app (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PWA: service worker + manifest must always revalidate, or updates
    # to the app shell / caching logic would never reach installed clients.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }

    # Angular fingerprints its bundles — safe to cache aggressively.
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Docker embedded DNS resolver with 10s TTL to prevent stale upstream IPs when containers recreate
    resolver 127.0.0.11 valid=10s;

    # Proxy API calls to NestJS backend
    location /api/ {
        set $upstream_backend http://backend:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Infra: Dozzle (container logs) embedded in the admin Infrastructure
    # page as an iframe. SECURITY: an iframe src is fetched by the browser
    # directly — it carries NO admin JWT — so this path has its own
    # basic-auth gate (browser remembers it after first entry). Dozzle runs
    # auth-less behind this gate; logs can leak OTPs/tokens, so the
    # credential in infra.htpasswd is sensitive — change the default.
    location /infra/dozzle/ {
        auth_basic "Gixbee infra";
        auth_basic_user_file /etc/nginx/infra.htpasswd;

        set $upstream_dozzle http://dozzle:8080;
        proxy_pass $upstream_dozzle;

        # Dozzle streams logs over SSE/WebSocket — without these the UI
        # loads and then silently freezes.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;

        # Allow embedding in the admin panel (same origin only).
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }
}

# ── Beszel (host + per-container metrics) on its own port. PocketBase does
# not support sub-path hosting, so it can't live under /infra/ — it gets a
# dedicated listener instead and opens in a new tab from the Infrastructure
# page. No basic-auth here: Beszel ships its own real login (you create the
# admin user on first open).
server {
    listen 8091;
    server_name _;

    resolver 127.0.0.11 valid=10s;

    location / {
        set $upstream_beszel http://beszel:8090;
        proxy_pass $upstream_beszel;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_read_timeout 1h;

        # Allow embedding in the admin panel iframe.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "frame-ancestors 'self' http://13.233.60.215 http://localhost" always;
    }
}
