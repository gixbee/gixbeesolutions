version: '3.9'

# ─── Shared network ──────────────────────────────────────────────────────────
networks:
  gixbee_net:
    driver: bridge

# ─── Named volumes ───────────────────────────────────────────────────────────
volumes:
  postgres_data:
  uploads_data:

# ─── Services ────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gixbee_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: gixbee123
      # MUST match DATABASE_NAME in backend/.env. NOTE: POSTGRES_DB only takes
      # effect when the data volume is empty (first boot) — changing it later
      # does NOT rename/create anything, it just makes the healthcheck below
      # probe a database that doesn't exist ("FATAL: database ... does not
      # exist" spam every 10s). To truly rename, create the DB by hand or wipe
      # the volume with `docker compose down -v`.
      POSTGRES_DB: gixbee_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gixbee_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gixbee_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gixbee_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    networks:
      - gixbee_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NestJS Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gixbee_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: development
      PORT: 3000
      FIREBASE_KEY_PATH: /app/firebase-service-account.json
    volumes:
      - uploads_data:/app/uploads
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:ro
    networks:
      - gixbee_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"

  # ── Admin Panel (Angular) ──────────────────────────────────────────────────
  admin:
    build:
      context: ./super-admin-web
      dockerfile: Dockerfile
    container_name: gixbee_admin
    restart: unless-stopped
    networks:
      - gixbee_net
    depends_on:
      - backend
    ports:
      - "80:80"
