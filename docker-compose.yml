version: '3.9'

# ─── Shared network ──────────────────────────────────────────────────────────
networks:
  gixbee_net:
    driver: bridge

# ─── Named volumes ───────────────────────────────────────────────────────────
volumes:
  postgres_data:
  # PostgreSQL 18+ stores the cluster under /var/lib/postgresql/18/docker.
  # This volume is separate from the PostgreSQL 16 data volume so a failed
  # upgrade can roll back to that volume.
  postgres_data_18:
  uploads_data:
  redis_data:
  beszel_data:
  pgadmin_data:

# ─── Services ────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    build:
      context: ./postgres
    image: gixbee-postgres:18
    container_name: gixbee_postgres
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: gixbee123
      # MUST match DATABASE_NAME in deploy/.env. NOTE: POSTGRES_DB only takes
      # effect when the data volume is empty (first boot) — changing it later
      # does NOT rename/create anything, it just makes the healthcheck below
      # probe a database that doesn't exist ("FATAL: database ... does not
      # exist" spam every 10s). To truly rename, create the DB by hand or wipe
      # the volume with `docker compose down -v`.
      POSTGRES_DB: gixbee_db
    # Bound runaway queries at the server (PgBouncer rejects client-side
    # `options: -c statement_timeout=...` startup parameters).
    command: ["postgres", "-c", "statement_timeout=60s"]
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - postgres_data_18:/var/lib/postgresql
    networks:
      - gixbee_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gixbee_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PgBouncer (connection pooler) ─────────────────────────────────────
  # Sits between the backend and Postgres. Thousands of client connections
  # share DEFAULT_POOL_SIZE real server connections (Postgres default
  # max_connections=100), which removes the TypeORM 5s pool-timeout failures
  # under load. Transaction pooling mode = one server conn per transaction.
  # CAVEAT (enforced in app.module TypeORM extra + AGENTS.md): session-level
  # features (LISTEN/NOTIFY, session advisory locks, named PREPARE that
  # outlive a transaction) do NOT work in transaction mode. Stay in
  # transaction mode for connection multiplexing under load — do not flip
  # to session mode without revisiting pool sizing.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: gixbee_pgbouncer
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DB_USER: postgres
      DB_PASSWORD: gixbee123
      DB_HOST: postgres
      DB_NAME: gixbee_db
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 10000
      DEFAULT_POOL_SIZE: 40
      RESERVE_POOL_SIZE: 10
      QUERY_WAIT_TIMEOUT: 15
      CLIENT_IDLE_TIMEOUT: 30
      # Drop any leftover session state between client checkouts (safe no-op
      # under transaction mode; documents the pooling contract).
      SERVER_RESET_QUERY: DISCARD ALL
      PGBOUNCER_QUERY_WAIT_TIMEOUT: 15
      PGBOUNCER_CLIENT_IDLE_TIMEOUT: 30
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
      AUTH_TYPE: scram-sha-256
      PGBOUNCER_AUTH_TYPE: scram-sha-256
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: postgres
      POSTGRESQL_PASSWORD: gixbee123
      PGBOUNCER_DATABASE: gixbee_db
      PGBOUNCER_PORT: 6432
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "10000"
      PGBOUNCER_DEFAULT_POOL_SIZE: "40"
      PGBOUNCER_RESERVE_POOL_SIZE: "10"
      PGBOUNCER_IGNORE_STARTUP_PARAMETERS: extra_float_digits
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - gixbee_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gixbee_redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # maxmemory: without a cap Redis grows until the LINUX OOM KILLER picks a
    # victim (possibly Postgres). noeviction (not allkeys-lru!) because Bull
    # jobs + outbox dispatch + OTPs live here — BullMQ requires noeviction;
    # an evicted job disappears silently. Cache keys all carry TTLs, so
    # normal operation stays far below the cap. AOF persists queued jobs
    # across restarts. If used_memory ever nears 512mb, split into a second
    # cache-only instance with allkeys-lru instead of raising this blindly.
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - gixbee_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Coturn (WebRTC TURN/STUN for in-app voice) ─────────────────────────────
  # Clients get credentials from GET /bookings/:id/webrtc-config.
  # Set TURN_EXTERNAL_IP to the host public IP so relay candidates work.
  # Without a public IP, STUN-only still works on many same-LAN paths.
  coturn:
    image: coturn/coturn:4.6.2
    container_name: gixbee_coturn
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # host networking so relay candidates use the EC2 public IP correctly.
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --fingerprint
      - --lt-cred-mech
      - --user=gixbee:${TURN_CREDENTIAL:-gixbee_turn_dev}
      - --realm=gixbee.local
      - --no-cli
      - --no-tls
      - --no-dtls
      - --min-port=49160
      - --max-port=49200
      - --external-ip=${TURN_EXTERNAL_IP:-13.233.60.215}

  # ── Rust API (Axum) ──────────────────────────────────────────────────────
  backend_rust:
    build:
      context: ./backend_rust
      dockerfile: Dockerfile
    deploy:
      replicas: 2
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ./deploy/.env
    environment:
      DATABASE_HOST: pgbouncer
      DATABASE_PORT: 6432
      DATABASE_NAME: gixbee_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_ALLOW_MEMORY_FALLBACK: "false"
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      FIREBASE_KEY_PATH: /app/firebase-service-account.json
      UPLOADS_DIR: /app/uploads
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - uploads_data:/app/uploads
      - ./deploy/firebase-service-account.json:/app/firebase-service-account.json:ro
    networks:
      gixbee_net:
        aliases:
          - api
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Nginx API Load Balancer ────────────────────────────────────────────────
  api_balancer:
    image: nginx:alpine
    container_name: gixbee_api_balancer
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./nginx/lb.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/infra.htpasswd:ro
      - uploads_data:/app/uploads
    networks:
      - gixbee_net
    depends_on:
      - postgres
      - pgbouncer
      - redis
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Admin Panel (Angular) ──────────────────────────────────────────────────
  admin:
    build:
      context: ./super-admin-web
      dockerfile: Dockerfile
    container_name: gixbee_admin
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - gixbee_net
    depends_on:
      - postgres
      - pgbouncer
      - redis
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Infrastructure Monitoring: Dozzle (Live Logs) ──────────────────────────
  dozzle:
    image: amir20/dozzle:latest
    container_name: gixbee_dozzle
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DOZZLE_BASE: /infra/dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - gixbee_net
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Infrastructure Monitoring: Beszel (Resource Hub) ───────────────────────
  beszel:
    image: henrygd/beszel:latest
    container_name: gixbee_beszel
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      APP_URL: "http://103.102.234.152/infra/beszel"
    volumes:
      - beszel_data:/beszel_data
    networks:
      - gixbee_net
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Infrastructure Monitoring: Beszel Agent ────────────────────────────────
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: gixbee_beszel_agent
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      PORT: 45876
      KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEZQbTmkXErS2aTxj9VGTky6+IJo0tDt+gPm5UycyGfk"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - gixbee_net
    depends_on:
      - beszel
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Infrastructure: pgAdmin (DB console) ───────────────────────────────────
  # Embedded under /infra/pgadmin/ in the admin panel. Nginx basic-auth gates
  # the path; pgAdmin still requires its own login. Not published on a host
  # port — only reachable via the admin reverse proxy on gixbee_net.
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: gixbee_pgadmin
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gixbee.com
      PGADMIN_DEFAULT_PASSWORD: gixbee-pgadmin-2026
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # Allow .local later if needed; use a real TLD so email validation passes.
      PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: "False"
      SCRIPT_NAME: /infra/pgadmin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - gixbee_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:80/infra/pgadmin/misc/ping || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
