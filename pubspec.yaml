name: gixbee
description: "Gixbee: The Skill Intelligence Network"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Networking & Real-time
  dio: ^5.4.3
  socket_io_client: ^3.1.6

  # Firebase — FCM push notifications only
  # firebase_auth intentionally excluded
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3

  # Local notifications (foreground display on Android)
  flutter_local_notifications: ^22.1.0

  # Auth

  # Secure token storage
  flutter_secure_storage: ^10.3.1

  # Maps & Location
  url_launcher: ^6.3.0
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  # Ola Maps (vector tiles conform to the MapLibre style spec — no official
  # Flutter SDK, so we render via maplibre_gl). Directions/ETA also via Ola
  # (see AppConfig.olaDirectionsUrl). Key: --dart-define=OLA_MAPS_API_KEY.
  maplibre_gl: 0.21.0

  # Payments
  razorpay_flutter: ^1.3.7

  # Photo / certificate capture (web-safe; no native config needed)
  image_picker: ^1.1.2

  # UI & Design
  google_fonts: ^8.2.0
  flutter_animate: ^4.5.0
  carousel_slider: ^5.0.0
  glass_kit: ^4.0.2
  cupertino_icons: ^1.0.8
  dynamic_color: ^1.7.0

  # Utils
  uuid: ^4.4.0
  intl: ^0.20.3
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.3

# package_info_plus 10.x fails release Java registrant compile on this
# toolchain (PackageInfoPlugin symbol missing). Pin until JDK/AGP catch up.
dependency_overrides:
  package_info_plus: 9.0.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/gixbee_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/gixbee_logo.png"
