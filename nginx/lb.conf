worker_processes auto;

events {
    worker_connections 10240;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Docker embedded DNS resolver with 5s TTL to discover all scaled container replicas
    resolver 127.0.0.11 valid=5s;

    server {
        listen 3000;
        server_name _;

        # WebSocket & Socket.io location (Long timeouts for real-time channels)
        location /socket.io/ {
            set $upstream http://backend:3000;
            proxy_pass $upstream;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 60s;
            proxy_cache_bypass $http_upgrade;
        }

        # Standard REST API location (Short fail-fast timeouts to shed excess overload)
        location / {
            set $upstream http://backend:3000;
            proxy_pass $upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            proxy_connect_timeout 5s;
        }
    }
}
