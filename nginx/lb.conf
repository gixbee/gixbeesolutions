worker_processes auto;

events {
    worker_connections 10240;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Docker embedded DNS resolver with 5s TTL to discover all scaled container replicas
    resolver 127.0.0.11 valid=5s;

    server {
        listen 3000;
        server_name _;

        # WebSocket & Socket.io location (Long timeouts for real-time channels)
        location /socket.io/ {
            set $upstream http://backend:3000;
            proxy_pass $upstream;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 60s;
            proxy_cache_bypass $http_upgrade;
        }

        # Infra: Dozzle (container logs)
        location ^~ /infra/dozzle/ {
            set $upstream_dozzle http://dozzle:8080;
            proxy_pass $upstream_dozzle;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 1h;

            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            add_header Content-Security-Policy "frame-ancestors 'self' http://13.233.60.215 http://localhost" always;
        }
        location = /infra/dozzle {
            return 301 /infra/dozzle/;
        }

        # Infra: Beszel (resource metrics)
        location ^~ /infra/beszel/ {
            set $upstream_beszel http://beszel:8090;
            rewrite ^/infra/beszel/(.*)$ /$1 break;
            proxy_pass $upstream_beszel;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 1h;

            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            add_header Content-Security-Policy "frame-ancestors 'self' http://13.233.60.215 http://localhost" always;
        }
        location = /infra/beszel {
            return 301 /infra/beszel/;
        }

        # Infra: pgAdmin (Postgres console) — also reachable via API balancer
        # if needed; prefer the admin panel path on :80.
        location ^~ /infra/pgadmin/ {
            auth_basic "Gixbee Infra";
            auth_basic_user_file /etc/nginx/infra.htpasswd;

            set $upstream_pgadmin http://pgadmin:80;
            proxy_pass $upstream_pgadmin/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Script-Name /infra/pgadmin;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_read_timeout 1h;
            proxy_buffering off;

            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            add_header Content-Security-Policy "frame-ancestors 'self' http://13.233.60.215 http://localhost" always;
        }
        location = /infra/pgadmin {
            return 301 /infra/pgadmin/;
        }

        # Standard REST API location (Short fail-fast timeouts to shed excess overload)
        location / {
            set $upstream http://backend:3000;
            proxy_pass $upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            proxy_connect_timeout 5s;
        }
    }
}
