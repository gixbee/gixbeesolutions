version: '3.9'

# ── Development override ──────────────────────────────────────────────────────
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Differences from production:
#  - Hot reload (Rust cargo-watch)
#  - Database and Redis ports exposed to host
#  - No Nginx LB — access API directly on port 3000
#  - NODE_ENV=development

services:

  postgres:
    ports:
      - "5437:5432"

  redis:
    ports:
      - "6379:6379"

  backend_rust:
    build:
      context: ./backend_rust
      dockerfile: Dockerfile.dev
    env_file:
      - ./deploy/.env
    environment:
      NODE_ENV: development
      UPLOADS_DIR: /app/uploads
    volumes:
      - ./backend_rust/src:/app/src
      - ./backend_rust/Cargo.toml:/app/Cargo.toml
    ports:
      - "3000:3000"
    networks:
      gixbee_net:
        aliases:
          - api

  api_balancer:
    profiles: ["production"]