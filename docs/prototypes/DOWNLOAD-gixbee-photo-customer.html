<!DOCTYPE html>
<!-- GIXBEE PHOTO CUSTOMER — single self-contained flow HTML. Open GIXBEE-PHOTO-CUSTOMER-FINALFLOW5.html. Do NOT open photo-customer-flow-shell.html. -->

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gixbee — Photography (Customer)</title>
<style>
:root{--navy:#0F1B4C;--blue:#1A237E;--blue2:#2563EB;--ink:#111827;--mut:#64748B;--line:#E5E7EB;--soft:#EFF6FF;--shadow:0 10px 32px rgba(15,23,42,.1);--orange:#F59E0B;--gn:#16A34A}
*{box-sizing:border-box}
body{margin:0;background:#E8EDF5;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
.stage{min-height:100vh;display:flex;justify-content:center;padding:12px 8px 24px}
.phone{width:min(100%,430px);background:#fff;min-height:920px;border-radius:36px;box-shadow:var(--shadow);overflow:hidden;position:relative;border:8px solid #111;display:flex;flex-direction:column}
.scr{display:none;flex:1;overflow:auto;padding:0 0 72px}
.scr.on{display:block}
.scr.has-dual-foot{padding-bottom:132px}
.p-ico{width:22px;height:22px;display:inline-block;vertical-align:middle;flex-shrink:0}
.app-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px;background:#fff}
.brand{display:flex;align-items:center;gap:10px}
.brand-ico{width:38px;height:38px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.brand b{display:block;font-size:17px;color:var(--blue);font-weight:900;line-height:1.15}
.brand span{font-size:11px;color:var(--blue2);font-weight:700}
.hd-icons{display:flex;gap:10px;align-items:center;color:var(--navy)}
.hd-icons .dot{position:relative}
.hd-icons .dot::after{content:'';position:absolute;top:0;right:0;width:7px;height:7px;background:#EF4444;border-radius:50%;border:2px solid #fff}
.top{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
.top .back{border:0;background:none;font-size:22px;color:var(--blue);cursor:pointer;width:36px;height:36px}
.top h1{margin:0;font-size:16px;flex:1;text-align:center;color:var(--blue);font-weight:800;line-height:1.25}
.top .sub-hd{font-size:11px;color:var(--mut);font-weight:700;text-align:center;margin:-4px 16px 8px}
.hero-wed{position:relative;min-height:150px;background:linear-gradient(180deg,rgba(15,27,76,.15),rgba(15,27,76,.55)),linear-gradient(145deg,#93C5FD,#1E3A8A) center/cover;color:#fff;padding:20px 16px 28px}
.hero-wed h2{margin:0 0 6px;font-size:20px;font-weight:900;line-height:1.25}
.hero-wed p{margin:0;font-size:12px;opacity:.95;font-weight:600}
.hero-svc{min-height:120px;background:linear-gradient(145deg,#64748B,#334155);color:#fff;padding:20px 16px}
.hero-svc h2{margin:0 0 4px;font-size:18px;font-weight:900}
.hero-svc p{margin:0;font-size:12px;opacity:.9}
.search-card{margin:-18px 16px 0;padding:16px 14px;background:#fff;border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow);position:relative;z-index:2}
.fld{margin:0 0 14px}
.fld>label{display:block;font-size:12px;font-weight:800;color:var(--blue);margin:0 0 6px}
.sel-box{display:flex;align-items:center;gap:8px;padding:11px 12px;border:1.5px solid #BFDBFE;border-radius:12px;background:#fff;width:100%}
.sel-box select,.sel-box input{border:0;background:transparent;flex:1;font:inherit;font-weight:700;color:var(--blue);outline:none;min-width:0}
.comm-row{display:flex;gap:8px;overflow:auto;padding-bottom:4px}
.comm-btn{flex:none;width:64px;border:1.5px solid #BFDBFE;border-radius:14px;padding:8px 6px;background:#fff;cursor:pointer;text-align:center;font:inherit}
.comm-btn.on{border-color:var(--blue2);background:var(--soft)}
.comm-btn .c-ico{font-size:22px;line-height:1;margin-bottom:4px}
.comm-btn span{display:block;font-size:9px;font-weight:800;color:var(--blue)}
.pkg-type-row{display:flex;gap:8px;flex-wrap:wrap}
.pkg-type-btn{flex:1;min-width:72px;border:1.5px solid #BFDBFE;border-radius:12px;padding:10px 6px;background:#fff;cursor:pointer;font:inherit;text-align:center}
.pkg-type-btn.on{border-color:var(--blue2);background:var(--soft)}
.pkg-type-btn b{display:block;font-size:11px;font-weight:900;color:var(--blue)}
.budget-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.range-dual{margin-top:6px}
.range-dual input[type=range]{width:100%;accent-color:var(--blue2)}
.range-dual .range-lbl{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--blue2);margin-top:4px}
.btn{width:100%;border:0;border-radius:999px;background:var(--blue2);color:#fff;font-weight:800;font-size:15px;padding:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 14px rgba(37,99,235,.35)}
.btn.outline{background:#fff;color:var(--blue);border:1.5px solid #BFDBFE;box-shadow:none}
.btn.sm{padding:10px 14px;font-size:13px;width:auto}
.cta{padding:12px 16px}
.res-bar{padding:8px 16px;font-size:12px;font-weight:800;color:var(--blue)}
.res-bar .ctx{color:var(--mut);font-weight:700;display:block;font-size:11px;margin-top:2px}
.filter-row{display:flex;gap:8px;overflow:auto;padding:6px 16px 8px}
.fchip{flex:none;padding:8px 12px;border-radius:99px;border:1.5px solid #BFDBFE;font-size:11px;font-weight:800;background:#fff;color:var(--blue)}
.res-meta{display:flex;justify-content:space-between;align-items:center;padding:4px 16px 10px;font-size:13px;font-weight:800;color:var(--blue)}
.ph-row{display:flex;gap:10px;border:1.5px solid #E2E8F0;border-radius:16px;padding:10px;margin:0 16px 12px;background:#fff;cursor:pointer;text-align:left;width:calc(100% - 32px);font:inherit;color:inherit}
.ph-thumb{width:88px;height:88px;border-radius:12px;flex-shrink:0;background:linear-gradient(145deg,#CBD5E1,#64748B);position:relative}
.ph-thumb .heart{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.12);cursor:pointer}
.ph-bd{flex:1;min-width:0}
.ph-bd b{font-size:14px;color:var(--navy);font-weight:900;display:block;margin-bottom:4px}
.ph-rating{font-size:11px;font-weight:700;color:var(--mut);margin-bottom:6px}
.ph-rating .star{color:#F59E0B}
.ph-price{font-size:13px;font-weight:900;color:var(--blue)}
.ph-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.ph-tag{font-size:9px;font-weight:800;padding:4px 8px;border-radius:8px;background:#EFF6FF;color:var(--blue2)}
.detail-hero{height:220px;position:relative;background:linear-gradient(145deg,#64748B,#334155)}
.detail-hero .fab{position:absolute;top:12px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.95);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12);color:var(--blue)}
.detail-hero .fab.back{left:12px;font-size:18px}
.detail-hero .fab.r{right:12px}
.detail-hero .fab.r2{right:56px}
.detail-hero .gal{position:absolute;right:12px;bottom:12px;font-size:10px;font-weight:800;background:rgba(0,0,0,.55);color:#fff;padding:4px 9px;border-radius:99px}
.title-block{padding:14px 16px 0}
.title-block .name{font-size:20px;font-weight:900;color:var(--navy);line-height:1.2}
.title-block .meta{font-size:12px;font-weight:700;color:var(--mut);margin-top:6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 16px;text-align:center}
.stat-cell{font-size:10px;font-weight:800;color:var(--blue);line-height:1.3}
.stat-cell .ic{font-size:22px;margin-bottom:4px}
.prof-tabs{display:flex;border-bottom:1px solid var(--line);padding:0 16px}
.prof-tabs button{flex:1;border:0;background:none;padding:12px 4px;font:inherit;font-size:12px;font-weight:800;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent}
.prof-tabs button.on{color:var(--blue2);border-bottom-color:var(--blue2)}
.prof-panel{padding:14px 16px;font-size:13px;line-height:1.5;color:var(--ink)}
.prof-panel h3{font-size:14px;margin:0 0 8px;color:var(--navy)}
.area-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.area-tags span{font-size:10px;font-weight:800;padding:6px 10px;border-radius:99px;background:#F1F5F9;color:var(--blue)}
.dual-foot{position:absolute;left:0;right:0;bottom:56px;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 16px;background:#fff;border-top:1px solid var(--line);z-index:4}
.pkg-card{display:flex;gap:10px;border:1.5px solid #E2E8F0;border-radius:16px;padding:12px;margin:0 16px 12px;background:#fff;cursor:pointer;text-align:left;width:calc(100% - 32px);font:inherit}
.pkg-card .thumb{width:72px;height:72px;border-radius:12px;background:linear-gradient(145deg,#CBD5E1,#64748B);flex-shrink:0}
.pkg-card b{font-size:14px;color:var(--navy);display:block;margin-bottom:4px}
.pkg-card .price{font-size:15px;font-weight:900;color:var(--blue2);margin-bottom:6px}
.pkg-card ul{margin:0;padding:0 0 0 16px;font-size:11px;color:var(--mut);font-weight:600;line-height:1.45}
.pkg-card .link{font-size:12px;font-weight:800;color:var(--blue2);margin-top:8px;display:inline-block}
.offer-hero{height:160px;background:linear-gradient(145deg,#64748B,#475569);position:relative}
.offer-hero .price-tag{position:absolute;left:16px;bottom:12px;color:#fff}
.offer-hero .price-tag b{font-size:24px;display:block}
.offer-hero .price-tag span{font-size:12px;opacity:.9}
.detail-tabs{display:flex;gap:4px;padding:10px 16px 0;overflow:auto}
.detail-tabs button{flex:none;border:0;background:#F1F5F9;border-radius:99px;padding:8px 14px;font:inherit;font-size:11px;font-weight:800;color:var(--mut);cursor:pointer}
.detail-tabs button.on{background:var(--blue2);color:#fff}
.detail-panel{padding:14px 16px 8px}
.chk-list{margin:0;padding:0;list-style:none}
.chk-list li{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #F1F5F9;font-size:13px;font-weight:600;color:var(--ink)}
.chk-list li::before{content:'✓';color:var(--blue2);font-weight:900;flex-shrink:0}
.extra-line{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #F1F5F9;font-size:13px;font-weight:600}
.extra-line input{accent-color:var(--blue2);width:18px;height:18px}
.review-summary{display:flex;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:14px;align-items:center}
.review-summary .thumb{width:56px;height:56px;border-radius:10px;background:linear-gradient(145deg,#CBD5E1,#64748B);flex-shrink:0}
.kv-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #F3F4F6;font-size:13px}
.kv-row span{color:var(--mut);font-weight:600}
.kv-row b{color:var(--blue);font-weight:800;text-align:right;max-width:55%}
.cust-hd{font-size:15px;font-weight:900;color:var(--navy);margin:16px 0 10px}
.radio-card{display:block;border:1.5px solid #E2E8F0;border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.radio-card.on{border-color:var(--blue2);background:var(--soft)}
.radio-card input{margin-right:8px}
textarea.notes{width:100%;min-height:88px;border:1.5px solid #BFDBFE;border-radius:12px;padding:12px;font:inherit;font-weight:600;resize:vertical}
.notes-count{font-size:10px;color:var(--mut);text-align:right;margin-top:4px}
.sent-wrap{padding:32px 24px;text-align:center}
.sent-wrap .plane{font-size:56px;margin-bottom:12px}
.sent-wrap h2{margin:0 0 8px;color:var(--navy);font-size:20px}
.timeline{margin:24px 0;text-align:left;padding:0 16px}
.tl-item{display:flex;gap:12px;padding:0 0 18px;position:relative}
.tl-item::before{content:'';position:absolute;left:11px;top:24px;bottom:0;width:2px;background:#E2E8F0}
.tl-item:last-child::before{display:none}
.tl-dot{width:24px;height:24px;border-radius:50%;border:2px solid #CBD5E1;flex-shrink:0;background:#fff;display:grid;place-items:center;font-size:11px;font-weight:900;color:#fff}
.tl-item.done .tl-dot{background:var(--gn);border-color:var(--gn)}
.tl-item.cur .tl-dot{border-color:var(--orange);background:var(--orange)}
.tl-bd b{display:block;font-size:13px;color:var(--navy)}
.tl-bd span{font-size:11px;color:var(--mut);font-weight:600}
.int-tabs{display:flex;gap:0;border-bottom:1px solid var(--line);padding:0 16px}
.int-tabs button{flex:1;border:0;background:none;padding:12px;font:inherit;font-size:13px;font-weight:800;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent}
.int-tabs button.on{color:var(--blue2);border-bottom-color:var(--blue2)}
.int-card{border:1.5px solid #E2E8F0;border-radius:16px;margin:12px 16px;padding:12px;background:#fff;cursor:pointer;text-align:left;width:calc(100% - 32px);font:inherit}
.int-card .status{display:inline-block;font-size:10px;font-weight:800;padding:4px 10px;border-radius:99px;margin-top:6px}
.int-card .status.review{background:#FEF3C7;color:#B45309}
.int-card .status.ok{background:#DCFCE7;color:#166534}
.pick-grid{padding:16px;display:grid;gap:12px}
.pick-tile{border:0;border-radius:18px;padding:20px 16px;text-align:left;cursor:pointer;font:inherit;color:#fff;min-height:100px;position:relative;overflow:hidden}
.pick-tile.wed{background:linear-gradient(135deg,#1D4ED8,#7C3AED)}
.pick-tile.svc{background:linear-gradient(135deg,#475569,#1E293B)}
.pick-tile b{display:block;font-size:17px;font-weight:900;margin-bottom:6px}
.pick-tile span{font-size:12px;opacity:.92;font-weight:600;line-height:1.4}
.bottom-nav{display:flex;border-top:1px solid var(--line);background:#fff;padding:8px 0 10px;position:absolute;left:0;right:0;bottom:0;z-index:5}
.bottom-nav button{flex:1;border:0;background:none;font-size:10px;font-weight:800;color:#64748B;cursor:pointer;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px}
.bottom-nav button.on{color:var(--blue2)}
#buildTag{font-size:10px;color:var(--mut);padding:8px 16px;text-align:center}
.toast{position:absolute;left:16px;right:16px;bottom:80px;background:#111;color:#fff;padding:12px;border-radius:12px;display:none;z-index:9;font-size:13px}
.stars-bar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.stars-bar b{font-size:28px;color:var(--navy)}
.bar-dist{flex:1;font-size:10px;font-weight:700;color:var(--mut)}
.rev-item{padding:12px 0;border-bottom:1px solid #F1F5F9;font-size:12px}
.rev-item .who{font-weight:800;color:var(--navy)}
.pad16{padding:0 16px}
</style>
</head>
<body>
<div id="bootError" hidden style="position:fixed;inset:0;z-index:99999;background:#fff;padding:24px;font:15px sans-serif"></div>
<div class="stage"><div class="phone">

<section class="scr on" id="search">
  <div class="app-hd"><div class="brand"><span class="brand-ico" id="brandIcoSearch"></span><div><b>Gixbee</b><span>Photography</span></div></div><div class="hd-icons"><span class="dot" id="bellSearch"></span></div></div>
  <div id="searchHero"></div>
  <div class="search-card" id="searchForm"></div>
  <div class="cta"><button type="button" class="btn" id="goResults">Search Photographers</button></div>
  <p id="buildTag">Photography customer flow</p>
</section>

<section class="scr" id="results">
  <div class="top"><button type="button" class="back" data-back>←</button><h1 id="resTitle">Photographers</h1><span style="width:36px"></span></div>
  <p class="sub-hd" id="resSub"></p>
  <div class="filter-row"><span class="fchip">⇅ Sort</span><span class="fchip">☰ Filter</span></div>
  <div class="res-meta"><span id="resCount">0 found</span></div>
  <div id="resList"></div>
</section>

<section class="scr has-dual-foot" id="profile">
  <div class="detail-hero"><button type="button" class="fab back" data-back>←</button><button type="button" class="fab r2" id="profHeart">♡</button><button type="button" class="fab r" id="profShare">⎙</button><span class="gal">1/20</span></div>
  <div class="title-block"><div class="name" id="profName">Studio</div><div class="meta" id="profMeta"></div></div>
  <div class="stat-row" id="profStats"></div>
  <div class="prof-tabs" id="profTabs"><button type="button" class="on" data-ptab="overview">Overview</button><button type="button" data-ptab="portfolio">Portfolio</button><button type="button" data-ptab="reviews">Reviews</button></div>
  <div class="prof-panel" id="profPanel"></div>
  <div class="dual-foot"><button type="button" class="btn outline" id="profMessage">Message</button><button type="button" class="btn" id="profPrimary">View Packages</button></div>
</section>

<section class="scr" id="catalog">
  <div class="top"><button type="button" class="back" data-back>←</button><h1 id="catTitle">Packages</h1><span style="width:36px"></span></div>
  <div class="filter-row" id="catFilters"></div>
  <div id="catList"></div>
</section>

<section class="scr has-dual-foot" id="detail">
  <div class="offer-hero" id="detailHero"><button type="button" class="fab back" data-back style="position:absolute;top:12px;left:12px">←</button><div class="price-tag" id="detailPriceTag"></div></div>
  <div class="pad16" style="padding-top:12px"><b id="detailName" style="font-size:17px;color:var(--navy)"></b></div>
  <div class="detail-tabs" id="detailTabs"></div>
  <div class="detail-panel" id="detailPanel"></div>
  <div class="dual-foot"><button type="button" class="btn outline" id="goCustomize">⚙ Customize Requirements</button><button type="button" class="btn" id="goCustomize2">✈ Initiate Interest</button></div>
</section>

<section class="scr" id="customize">
  <div class="top"><button type="button" class="back" data-back>←</button><h1>Customize Requirements</h1><span style="width:36px"></span></div>
  <div class="pad16" id="custSummary"></div>
  <div class="pad16" id="custBody"></div>
  <div class="cta"><button type="button" class="btn" id="goReview">Continue</button></div>
</section>

<section class="scr has-dual-foot" id="review">
  <div class="top"><button type="button" class="back" data-back>←</button><h1>Review Your Interest</h1><span style="width:36px"></span></div>
  <div class="pad16" id="reviewBody"></div>
  <div class="dual-foot" style="grid-template-columns:1fr 1fr"><button type="button" class="btn outline" data-to="customize">Edit Requirements</button><button type="button" class="btn" id="sendInterest">Send Interest</button></div>
</section>

<section class="scr" id="sent">
  <div class="sent-wrap">
    <div class="plane">✈</div>
    <h2>Your Interest has been Sent!</h2>
    <p style="font-size:13px;color:var(--mut);line-height:1.45;margin:0 0 20px">The photographer will review your request and contact you.</p>
    <div class="timeline" id="sentTimeline"></div>
    <button type="button" class="btn" data-to="interests">View My Interests</button>
  </div>
</section>

<section class="scr" id="interests">
  <div class="top"><button type="button" class="back" data-back style="visibility:hidden">←</button><h1>My Interests</h1><span style="width:36px"></span></div>
  <div class="int-tabs"><button type="button" class="on" data-intab="active">Active</button><button type="button" data-intab="past">Past</button></div>
  <div id="intList"></div>
</section>

<section class="scr has-dual-foot" id="interestDetail">
  <div class="top"><button type="button" class="back" data-back>←</button><h1>Interest Details</h1><span style="width:36px"></span></div>
  <div class="pad16" id="intDetailHead"></div>
  <div class="prof-tabs" style="margin-top:8px"><button type="button" class="on">Details</button><button type="button" disabled style="opacity:.5">Discussion</button></div>
  <div class="pad16" id="intDetailBody"></div>
  <div class="dual-foot" style="grid-template-columns:1fr"><button type="button" class="btn" id="msgPhotographer">Message Photographer</button></div>
</section>

<nav class="bottom-nav" id="bottomNav">
  <button type="button" class="on" data-nav="home"><span id="navHomeIco"></span>Home</button>
  <button type="button" data-nav="search"><span id="navSearchIco"></span>Search</button>
  <button type="button" data-nav="interests"><span id="navIntIco"></span>My Interests</button>
  <button type="button" data-nav="profile-stub"><span id="navProfIco"></span>Profile</button>
</nav>
<div class="toast" id="toast"></div>

<!-- APP_START -->
<script>
/** Inline SVG icons (mock-aligned). Included in customer flow app bundle. */
function svgIcon(name, cls) {
  const classes = ['flow-ico'];
  if (cls) classes.push(cls);
  const c = ' class="' + classes.join(' ') + '" aria-hidden="true"';
  const icons = {
    logo:
      '<svg' +
      c +
      ' viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="11" fill="#ECFDF3"/><path d="M12 19s-5.5-3.5-5.5-8a3.5 3.5 0 0 1 7 0c0 4.5-5.5 8-5.5 8z" fill="#12B76A"/></svg>',
    pin:

function activeNeed() {
  return PHOTO_NEEDS.find(function (n) {
    return n.id === state.photoNeed;
  });
}

function showPackageFilters() {
  const n = activeNeed();
  return !!(n && n.packagePath);
}

function syncModeFromNeed() {
  if (showPackageFilters()) {
    state.mode = 'wedding';
    return;
  }
  if (state.photoNeed) {
    state.mode = 'service';
    state.serviceId = state.photoNeed;
  }
}

function needLabel() {
  const n = activeNeed();
  return n && n.id ? n.label : 'Photography';
}

function el(id) {
  return document.getElementById(id);
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function inr(n) {
  return '₹ ' + Number(n).toLocaleString('en-IN');
}

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
}

function toast(msg) {
  const t = el('toast');
  if (!t) return;
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toast._tm);
  toast._tm = setTimeout(function () {
    t.style.display = 'none';
  }, 2200);
}

function studio() {
  return STUDIOS.find(function (s) {
    return s.id === state.studioId;
  }) || STUDIOS[0];
}

function activePackage() {
  return WEDDING_PACKAGES.find(function (p) {
    return p.id === state.packageId;
  }) || WEDDING_PACKAGES[1];
}

function offerTitle() {
  if (state.mode === 'wedding') return activePackage().name;
  if (state.photoNeed === 'funeral') return FUNERAL_SERVICE.name;
  return needLabel();
}

function offerPrice() {
  if (state.mode === 'wedding') return activePackage().price;
  let p = FUNERAL_SERVICE.price;
  const dur = FUNERAL_SERVICE.durationOptions.find(function (d) {
    return d.id === state.customize.duration;
  });
  if (dur) p += dur.add;
  FUNERAL_SERVICE.extras.forEach(function (ex) {
    if (state.customize.extras[ex.id]) p += ex.price;
  });
  return p;
}

function show(id, backTo) {
  if (backTo !== undefined) state.backScreen = backTo;
  document.querySelectorAll('.scr').forEach(function (s) {
    s.classList.toggle('on', s.id === id);
  });
  const nav = el('bottomNav');
  if (nav) {
    nav.style.display = ['results', 'profile', 'detail', 'catalog', 'customize', 'review', 'interestDetail'].indexOf(id) >= 0 ? 'none' : '';
  }
  document.querySelectorAll('[data-nav]').forEach(function (b) {
    const n = b.getAttribute('data-nav');
    b.classList.toggle(
      'on',
      ((n === 'home' || n === 'search') && id === 'search') ||
        (n === 'interests' && (id === 'interests' || id === 'interestDetail'))
    );
  });
}

function goBack() {
  show(state.backScreen || 'search');
}

function loadInterests() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state.interests = JSON.parse(raw);
  } catch (e) {
    state.interests = [];
  }
}

function saveInterests() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.interests));
  } catch (e) {
    /* ignore */
  }
}

function bindSearchForm() {
  const loc = el('fLoc');
  if (loc) loc.onchange = function () {
    state.location = loc.value;
  };
  const dt = el('fDate');
  if (dt) dt.onchange = function () {
    state.date = dt.value;
  };
  const comm = el('fComm');
  if (comm) {
    comm.querySelectorAll('[data-comm]').forEach(function (btn) {
      btn.onclick = function () {
        state.community = btn.getAttribute('data-comm');
        renderSearchForm();
      };
    });
  }
  const pkg = el('fPkg');
  if (pkg) {
    pkg.querySelectorAll('[data-pkg]').forEach(function (btn) {
      btn.onclick = function () {
        state.pkgLevel = btn.getAttribute('data-pkg');
        renderSearchForm();
      };
    });
  }
  const need = el('fNeed');
  if (need) {
    need.onchange = function () {
      state.photoNeed = need.value || '';
      syncModeFromNeed();
      renderSearchForm();
    };
  }
  const bmin = el('fBudMin');
  const bmax = el('fBudMax');
  if (bmin) bmin.onchange = function () {
    state.budgetMin = +bmin.value;
  };
  if (bmax) bmax.onchange = function () {
    state.budgetMax = +bmax.value;
  };
}

    '<div class="stat-cell"><div class="ic">📅</div>' +
    s.years +
    '<br>Years Experience</div><div class="stat-cell"><div class="ic">📷</div>' +
    s.events +
    '<br>' +
    (state.mode === 'wedding' ? 'Weddings' : 'Events') +
    '</div><div class="stat-cell"><div class="ic">👥</div>' +
    esc(s.team) +
    '</div>';
  const primary = el('profPrimary');
  if (primary) primary.textContent = state.mode === 'wedding' ? 'View Packages' : 'View Service';
  renderProfPanel();
}

function renderProfPanel() {
  const s = studio();
  const panel = el('profPanel');
  if (!panel) return;
  if (state.profTab === 'overview') {
    panel.innerHTML =
      '<h3>About Us</h3><p style="margin:0 0 14px;font-weight:600;color:var(--mut)">' +
      esc(s.about) +
      '</p><h3>Service Areas</h3><div class="area-tags">' +
      s.areas.map(function (a) {
        return '<span>' + esc(a) + '</span>';
      }).join('') +
      '</div>';
  } else if (state.profTab === 'portfolio') {
    panel.innerHTML = '<p class="sub">Portfolio grid — demo placeholders.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' + [1, 2, 3, 4].map(function () {
      return '<div style="height:80px;border-radius:10px;background:linear-gradient(145deg,#CBD5E1,#64748B)"></div>';
    }).join('') + '</div>';
  } else {
    panel.innerHTML = renderReviewsHtml();
  }
}

function renderReviewsHtml() {
  return (
    '<div class="stars-bar"><b>4.8</b><div class="bar-dist">★★★★★<br>56 reviews</div></div>' +
    '<div class="rev-item"><div class="who">Anitha K. · Dec 2025</div><div class="star">★★★★★</div>Beautiful photos and very professional team.</div>' +
    '<div class="rev-item"><div class="who">Rahul M. · Nov 2025</div><div class="star">★★★★☆</div>Great coverage and fast delivery.</div>'
  );
}

function renderCatalog() {
  el('catTitle').textContent = studio().name;
  const filters = el('catFilters');
  if (filters) {
    filters.innerHTML =
      '<span class="fchip">Community ▾</span><span class="fchip">Package type ▾</span>';
  }
  const list = el('catList');
  if (!list) return;
  list.innerHTML = WEDDING_PACKAGES.map(function (p) {
    return (
      '<button type="button" class="pkg-card" data-pkg="' +
      p.id +
      '"><div class="thumb"></div><div><b>' +
      esc(p.name) +
      '</b><div class="price">' +
      inr(p.price) +
      '</div><ul>' +
      p.bullets.map(function (b) {
        return '<li>' + esc(b) + '</li>';
      }).join('') +
      '</ul><span class="link">View Details ›</span></div></button>'
    );
  }).join('');
  list.querySelectorAll('[data-pkg]').forEach(function (btn) {
    btn.onclick = function () {
      state.packageId = btn.getAttribute('data-pkg');
      state.detailTab = 'inclusions';
      renderDetail();
      show('detail', 'catalog');
    };
  });
}

function renderDetail() {
  const name = el('detailName');
  const priceTag = el('detailPriceTag');
  const tabs = el('detailTabs');
  const panel = el('detailPanel');
  const isWed = state.mode === 'wedding';
  const title = offerTitle();
  const price = isWed ? activePackage().price : FUNERAL_SERVICE.price;
  if (name) name.textContent = title;
  if (priceTag) priceTag.innerHTML = '<b>' + inr(price) + '</b><span>' + (isWed ? 'Package price' : 'Base price') + '</span>';
  const tabIds = ['inclusions', 'coverage', 'extras', 'reviews'];
  const tabLbl = ['Inclusions', 'Coverage', 'Extras', 'Reviews'];
  if (tabs) {
    tabs.innerHTML = tabIds.map(function (id, i) {
      return (
        '<button type="button" class="' +
        (state.detailTab === id ? 'on' : '') +
        '" data-dtab="' +
        id +
        '">' +
        tabLbl[i] +
        '</button>'
      );
    }).join('');
    tabs.querySelectorAll('[data-dtab]').forEach(function (btn) {
      btn.onclick = function () {
        state.detailTab = btn.getAttribute('data-dtab');
        renderDetail();
      };
    });
  }
  if (!panel) return;
  if (state.detailTab === 'inclusions') {
    const items = isWed
      ? activePackage().bullets.concat(['Online gallery access', 'Basic color correction'])
      : FUNERAL_SERVICE.inclusions;
    panel.innerHTML = '<h3 style="margin:0 0 8px;font-size:15px">What\'s Included</h3><ul class="chk-list">' + items.map(function (t) {
      return '<li>' + esc(t) + '</li>';
    }).join('') + '</ul>';
  } else if (state.detailTab === 'coverage') {
    if (isWed) {
      panel.innerHTML =
        '<ul class="chk-list"><li>Wedding ceremony & reception coverage</li><li>8 hours on event day</li><li>2 candid photographers</li><li>Travel within 30 km included</li></ul>';
    } else {
      panel.innerHTML = FUNERAL_SERVICE.coverage.map(function (row) {
        return '<div class="kv-row"><span>' + esc(row.k) + '</span><b>' + esc(row.v) + '</b></div>';
      }).join('');
    }
  } else if (state.detailTab === 'extras') {
    const extras = isWed ? WED_EXTRAS : FUNERAL_SERVICE.extras;
    panel.innerHTML =
      '<p style="font-size:12px;font-weight:800;color:var(--mut);margin:0 0 8px">Additional Services (Optional)</p>' +
      extras.map(function (ex) {
        return (
          '<div class="extra-line"><span>' +
          esc(ex.label) +
          '</span><span style="font-weight:900;color:var(--blue)">' +
          inr(ex.price) +
          '</span></div>'
        );
      }).join('');
  } else {
    panel.innerHTML = renderReviewsHtml();
  }
}

function renderCustomize() {
  const sum = el('custSummary');
  const body = el('custBody');
  const title = offerTitle();
  const price = state.mode === 'wedding' ? activePackage().price : FUNERAL_SERVICE.price;
  if (sum) {
    sum.innerHTML =
      '<div class="review-summary"><div class="thumb"></div><div><b style="font-size:14px;color:var(--navy)">' +
      esc(title) +
      '</b><div style="font-size:15px;font-weight:900;color:var(--blue2);margin-top:4px">' +
      inr(price) +
      '</div></div></div>';
  }
  if (!body) return;
  if (state.mode === 'wedding') {
    body.innerHTML =
      '<div class="cust-hd">Additional Services (Optional)</div>' +
      WED_EXTRAS.map(function (ex) {
        return (
          '<label class="extra-line"><span><input type="checkbox" data-wex="' +
          ex.id +
          '"' +
          (state.customize.extras[ex.id] ? ' checked' : '') +
          '> ' +
          esc(ex.label) +
          '</span><span style="font-weight:900">' +
          inr(ex.price) +
          '</span></label>'
        );
      }).join('') +
      '<div class="cust-hd">Album Preferences</div>' +
      '<div class="budget-row"><div class="fld"><label>Album Size</label><div class="sel-box"><select id="albSize"><option>12×12</option><option>10×10</option></select></div></div>' +
      '<div class="fld"><label>Album Pages</label><div class="sel-box"><select id="albPages"><option>30</option><option>40</option></select></div></div></div>' +
      '<div class="cust-hd">Other Functions to Cover</div>' +
      ['Engagement', 'Reception', 'Wedding Eve'].map(function (fn) {
        return (
          '<label class="extra-line"><span><input type="checkbox" data-fn="' +
          fn +
          '"> ' +
          fn +
          '</span></label>'
        );
      }).join('') +
      '<div class="cust-hd">Additional Notes</div><textarea class="notes" id="custNotes" maxlength="500" placeholder="Any special requests…">' +
      esc(state.customize.notes) +
      '</textarea><div class="notes-count"><span id="noteCt">0</span>/500</div>';
    const goRev = el('goReview');
    if (goRev) goRev.textContent = 'Next: Review Interest';
  } else {
    body.innerHTML =
      '<div class="cust-hd">Coverage Duration</div>' +
      FUNERAL_SERVICE.durationOptions.map(function (d) {
        return (
          '<label class="radio-card' +
          (state.customize.duration === d.id ? ' on' : '') +
          '"><input type="radio" name="dur" value="' +
          d.id +
          '"' +
          (state.customize.duration === d.id ? ' checked' : '') +
          '> ' +
          esc(d.label) +
          (d.add ? ' · +' + inr(d.add) : '') +
          '</label>'
        );
      }).join('') +
      '<div class="cust-hd">Additional Services</div>' +
      FUNERAL_SERVICE.extras.map(function (ex) {
        return (
          '<label class="extra-line"><span><input type="checkbox" data-sex="' +
          ex.id +
          '"' +
          (state.customize.extras[ex.id] ? ' checked' : '') +
          '> ' +
          esc(ex.label) +
          '</span><span style="font-weight:900">' +
          inr(ex.price) +
          '</span></label>'
        );
      }).join('') +
      '<div class="cust-hd">Additional Notes</div><textarea class="notes" id="custNotes" maxlength="500">' +
      esc(state.customize.notes) +
      '</textarea><div class="notes-count"><span id="noteCt">0</span>/500</div>';
    const goRev = el('goReview');
    if (goRev) goRev.textContent = 'Continue';
  }
  bindCustomize();
}

function bindCustomize() {
  document.querySelectorAll('[data-wex]').forEach(function (inp) {
    inp.onchange = function () {
      state.customize.extras[inp.getAttribute('data-wex')] = inp.checked;
    };
  });
  document.querySelectorAll('[data-sex]').forEach(function (inp) {
    inp.onchange = function () {
      state.customize.extras[inp.getAttribute('data-sex')] = inp.checked;
    };
  });
  document.querySelectorAll('[name=dur]').forEach(function (inp) {
    inp.onchange = function () {
      state.customize.duration = inp.value;
      renderCustomize();
    };
  });
  const notes = el('custNotes');
  const ct = el('noteCt');
  if (notes) {
    const upd = function () {
      state.customize.notes = notes.value;
      if (ct) ct.textContent = String(notes.value.length);
    };
    notes.oninput = upd;
    upd();
  }
}

function renderReview() {
  const body = el('reviewBody');
  if (!body) return;
  const s = studio();
  body.innerHTML =
    '<div class="review-summary"><div class="thumb"></div><div style="flex:1"><b>' +
    esc(offerTitle()) +
    '</b><div style="font-weight:900;color:var(--blue2);margin-top:4px">' +
    inr(offerPrice()) +
    '</div></div><button type="button" class="btn sm outline" data-to="customize">Edit</button></div>' +
    '<div class="cust-hd">Event Details</div>' +
    '<div class="kv-row"><span>Studio</span><b>' +
    esc(s.name) +
    '</b></div>' +
    '<div class="kv-row"><span>Date</span><b>' +
    formatDate(state.date) +
    '</b></div>' +
    '<div class="kv-row"><span>Location</span><b>' +
    esc(state.location) +
    '</b></div>' +
    (state.mode === 'wedding'
      ? '<div class="kv-row"><span>Guests (est.)</span><b>300</b></div><div class="kv-row"><span>Budget</span><b>' +
        inr(state.budgetMin) +
        ' – ' +
        inr(state.budgetMax) +
        '</b></div>'
      : '') +
    '<div class="cust-hd">Selected Requirements</div>' +
    '<div id="revReqs"></div>' +
    (state.customize.notes
      ? '<div class="cust-hd">Additional Notes</div><p style="font-size:13px;font-weight:600;color:var(--mut)">' +
        esc(state.customize.notes) +
        '</p>'
      : '');
  const reqs = el('revReqs');
  if (reqs) {
    const lines = [];
    if (state.mode === 'service') {
      const dur = FUNERAL_SERVICE.durationOptions.find(function (d) {
        return d.id === state.customize.duration;
      });
      if (dur) lines.push(dur.label);
      FUNERAL_SERVICE.extras.forEach(function (ex) {
        if (state.customize.extras[ex.id]) lines.push(ex.label);
      });
    } else {
      WED_EXTRAS.forEach(function (ex) {
        if (state.customize.extras[ex.id]) lines.push(ex.label + ' — ' + inr(ex.price));
      });
    }
    reqs.innerHTML = lines.length
      ? lines.map(function (l) {
          return '<div class="kv-row"><span>•</span><b style="text-align:left">' + esc(l) + '</b></div>';
        }).join('')
      : '<p class="sub">No add-ons selected</p>';
  }
}

function renderSentTimeline() {
  const box = el('sentTimeline');
  if (!box) return;
  box.innerHTML = TIMELINE.map(function (step, i) {
    const cls = i === 0 ? 'done' : i === 1 ? 'cur' : '';
    return (
      '<div class="tl-item ' +
      cls +
      '"><div class="tl-dot">' +
      (i === 0 ? '✓' : '') +
      '</div><div class="tl-bd"><b>' +
      esc(step.label) +
      '</b><span>' +
      esc(step.sub) +
      '</span></div></div>'
    );
  }).join('');
}

function renderInterests() {
  const list = el('intList');
  if (!list) return;
  const items = state.intTab === 'active' ? state.interests.filter(function (x) {
    return x.status !== 'past';
  }) : state.interests.filter(function (x) {
    return x.status === 'past';
  });
  if (!items.length) {
    list.innerHTML =
      '<p style="text-align:center;padding:32px 16px;color:var(--mut);font-weight:600">No interests yet. Send one from a package or service.</p>';
    return;
  }
  list.innerHTML = items.map(function (it, idx) {
    return (
      '<button type="button" class="int-card" data-int="' +
      idx +
      '"><b>' +
      esc(it.studioName) +
      '</b><div style="font-size:12px;color:var(--mut);font-weight:700;margin-top:4px">' +
      esc(it.offerName) +
      ' · ' +
      formatDate(it.date) +
      '</div><span class="status ' +
      (it.statusLabel === 'Accepted' ? 'ok' : 'review') +
      '">' +
      esc(it.statusLabel) +
      '</span><div style="font-size:12px;font-weight:800;color:var(--blue2);margin-top:8px">View Details ›</div></button>'
    );
  }).join('');
  list.querySelectorAll('[data-int]').forEach(function (btn) {
    btn.onclick = function () {
      state.activeInterest = +btn.getAttribute('data-int');
      renderInterestDetail();
      show('interestDetail', 'interests');
    };
  });
}

function renderInterestDetail() {
  const it = state.interests[state.activeInterest];
  if (!it) return;
  el('intDetailHead').innerHTML =
    '<div class="review-summary"><div class="thumb"></div><div><b>' +
    esc(it.studioName) +
    '</b><div style="font-size:12px;color:var(--mut);font-weight:700">' +
    esc(it.offerName) +
    '</div><span class="status review">' +
    esc(it.statusLabel) +
    '</span></div></div>';
  el('intDetailBody').innerHTML =
    '<div class="cust-hd">Event Details</div>' +
    '<div class="kv-row"><span>Date</span><b>' +
    formatDate(it.date) +
    '</b></div>' +
    '<div class="kv-row"><span>Location</span><b>' +
    esc(it.location) +
    '</b></div>' +
    '<div class="kv-row"><span>Price (est.)</span><b>' +
    inr(it.price) +
    '</b></div>' +
    '<div class="cust-hd">Status Timeline</div>' +
    '<div class="timeline">' +
    TIMELINE.map(function (step, i) {
      const cls = i === 0 ? 'done' : i === 1 ? 'cur' : '';
      return (
        '<div class="tl-item ' +
        cls +
        '"><div class="tl-dot">' +
        (i === 0 ? '✓' : '') +
        '</div><div class="tl-bd"><b>' +
        esc(step.label) +
        '</b><span>' +
        (i === 1 ? formatDate(it.sentAt) + ' · 10:30 AM' : esc(step.sub)) +
        '</span></div></div>'
      );
    }).join('') +
    '</div>';
}

function submitInterest() {
  const rec = {
    id: 'int_' + Date.now(),
    mode: state.mode,
    studioName: studio().name,
    offerName: offerTitle(),
    date: state.date,
    location: state.location,
    price: offerPrice(),
    statusLabel: 'Under Review',
    status: 'active',
    sentAt: new Date().toISOString().slice(0, 10),
  };
  state.interests.unshift(rec);
  saveInterests();
  renderSentTimeline();
  show('sent', 'interests');
}

function injectChrome() {
  const logo = svgIcon ? svgIcon('logo') : '';
  if (el('brandIcoSearch')) el('brandIcoSearch').innerHTML = logo;
  if (el('navHomeIco')) el('navHomeIco').innerHTML = svgIcon('house');
  if (el('navSearchIco')) el('navSearchIco').innerHTML = svgIcon('search');
  if (el('navIntIco')) el('navIntIco').innerHTML = svgIcon('heart', 'flow-ico-sm');
  if (el('navProfIco')) el('navProfIco').innerHTML = svgIcon('people', 'flow-ico-sm');
}

function bindEvents() {
  el('goResults').onclick = function () {
    if (!state.photoNeed) {
      toast('Select what you need photography for');
      return;
    }
    syncModeFromNeed();
    renderResults();
    show('results', 'search');
  };
  document.querySelectorAll('[data-back]').forEach(function (btn) {
    btn.onclick = goBack;
  });
  document.querySelector('.phone').addEventListener('click', function (e) {
    const to = e.target.closest('[data-to]');
    if (to) {
      const id = to.getAttribute('data-to');
      if (id === 'customize') {
        renderCustomize();
        show('customize', 'detail');
      } else if (id === 'interests') {
        renderInterests();
        show('interests', 'pick');
      } else show(id);
      return;
    }
  });
  el('profPrimary').onclick = function () {
    if (state.mode === 'wedding') {
      renderCatalog();
      show('catalog', 'profile');
    } else {
      state.detailTab = 'inclusions';
      renderDetail();
      show('detail', 'profile');
    }
  };
  el('profMessage').onclick = function () {
    toast('Messaging opens in full app');
  };
  document.querySelectorAll('[data-ptab]').forEach(function (btn) {
    btn.onclick = function () {
      state.profTab = btn.getAttribute('data-ptab');
      document.querySelectorAll('[data-ptab]').forEach(function (b) {
        b.classList.toggle('on', b === btn);
      });
      renderProfPanel();
    };
  });
  ['goCustomize', 'goCustomize2'].forEach(function (id) {
    const n = el(id);
    if (n) n.onclick = function () {
      renderCustomize();
      show('customize', 'detail');
    };
  });
  el('goReview').onclick = function () {
    renderReview();
    show('review', 'customize');
  };
  el('sendInterest').onclick = submitInterest;
  document.querySelectorAll('[data-intab]').forEach(function (btn) {
    btn.onclick = function () {
      state.intTab = btn.getAttribute('data-intab');
      document.querySelectorAll('[data-intab]').forEach(function (b) {
        b.classList.toggle('on', b === btn);
      });
      renderInterests();
    };
  });
  document.querySelectorAll('[data-nav]').forEach(function (btn) {
    btn.onclick = function () {
      const nav = btn.getAttribute('data-nav');
      if (nav === 'home' || nav === 'search') {
        renderSearchForm();
        show('search', 'search');
      } else if (nav === 'interests') {
        renderInterests();
        show('interests', 'search');
      } else toast('Profile — demo');
    };
  });
  el('msgPhotographer').onclick = function () {
    toast('Open chat with photographer');
  };
}

function bootPhotoCustomer() {
  try {
    if (!el('goResults')) throw new Error('Open ' + DEMO_FILE + ', not the shell.');
    loadInterests();
    injectChrome();
    renderSearchForm();
    bindEvents();
    const tag = el('buildTag');
    if (tag) tag.textContent = PHOTO_CUSTOMER_BUILD + ' · Default home search';
    if (el('bootError')) el('bootError').hidden = true;
  } catch (err) {
    console.error(err);
    const box = el('bootError');
    if (box) {
      box.hidden = false;
      box.innerHTML = '<h1 style="color:#DC2626">Demo did not start</h1><p>' + esc(err.message) + '</p>';
    }
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bootPhotoCustomer);
} else {
  bootPhotoCustomer();
}

</script>
<!-- APP_END -->

</div></div>
</body>
</html>
