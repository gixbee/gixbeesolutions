<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gixbee — Catering Services (Customer)</title>
<style>
:root{--green:#15803D;--green2:#16A34A;--ink:#111827;--mut:#64748B;--line:#E5E7EB;--soft:#F0FDF4;--shadow:0 10px 28px rgba(15,23,42,.08)}
*{box-sizing:border-box}
body{margin:0;background:#E7F6EC;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
.stage{min-height:100vh;display:flex;justify-content:center;padding:12px 8px 24px}
.phone{width:min(100%,430px);background:#fff;min-height:920px;border-radius:36px;box-shadow:var(--shadow);overflow:hidden;position:relative;border:8px solid #111;display:flex;flex-direction:column}
.notch{height:28px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:12px;font-weight:700}
.scr{display:none;flex:1;overflow:auto;padding:0 0 24px;background:#fff}
.scr.on{display:block}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px 10px;background:#fff;position:sticky;top:0;z-index:5}
.top h1{margin:0;flex:1;text-align:center;font-size:17px;font-weight:900;color:#14532D}
.back,.icon-btn{border:0;background:#fff;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;color:#14532D}
.icon-btn.on{background:#F0FDF4}
.banner{margin:0 16px 14px;height:132px;border-radius:18px;background:linear-gradient(120deg,#166534 0%,#15803D 42%,#CA8A04 100%);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;position:relative;overflow:hidden}
.banner::after{content:"🍛 🥗 🥥 🍌";position:absolute;right:12px;top:16px;font-size:28px;letter-spacing:4px;opacity:.95}
.banner b{font-size:22px;font-weight:900;line-height:1.15;position:relative}
.banner span{font-size:12px;font-weight:600;opacity:.95;position:relative}
.pad{padding:0 16px}
.fld{margin:0 0 14px}
.fld label{display:block;font-size:13px;font-weight:800;margin:0 0 6px;color:#14532D}
.fld .opt{font-weight:700;color:#64748B}
.box{display:flex;align-items:center;gap:8px;border:1.5px solid #D1FAE5;background:#F8FFFB;border-radius:14px;padding:12px}
.box input{border:0;background:transparent;flex:1;font:inherit;font-weight:800;font-size:15px;color:#14532D;outline:none;min-width:0}
.date-box{cursor:pointer;align-items:center}
.date-readout{flex:1;font-weight:800;font-size:15px;color:#14532D;text-align:left}
.date-open{border:0;background:#DCFCE7;color:#15803D;font:inherit;font-weight:800;font-size:12px;padding:8px 12px;border-radius:999px;cursor:pointer;flex-shrink:0}
.date-native{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px}
.budget-val{text-align:center;font-size:20px;font-weight:900;color:#15803D;margin:10px 0 0;line-height:1.3}
.budget-sliders{margin-top:4px}
.dual-range{position:relative;height:40px;margin:10px 0 6px}
.dual-range-track{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:8px;background:#E5E7EB;border-radius:999px;pointer-events:none}
.dual-range-track span{position:absolute;top:0;height:100%;background:#16A34A;border-radius:999px;left:0;width:0}
.dual-range input[type=range]{position:absolute;left:0;top:0;width:100%;height:40px;margin:0;background:transparent;pointer-events:none;-webkit-appearance:none;appearance:none}
.dual-range input[type=range]::-webkit-slider-runnable-track{height:8px;background:transparent;border:0}
.dual-range input[type=range]::-moz-range-track{height:8px;background:transparent;border:0}
.dual-range input[type=range]::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;appearance:none;width:24px;height:24px;margin-top:-8px;border-radius:50%;background:#16A34A;border:3px solid #fff;box-shadow:0 2px 6px rgba(15,23,42,.18);cursor:pointer}
.dual-range input[type=range]::-moz-range-thumb{pointer-events:auto;width:24px;height:24px;border-radius:50%;background:#16A34A;border:3px solid #fff;box-shadow:0 2px 6px rgba(15,23,42,.18);cursor:pointer}
.range-ends{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:#64748B;margin-top:2px}
.fn-card{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid #E5E7EB;background:#fff;border-radius:16px;padding:12px;margin:0 0 10px;cursor:pointer;font:inherit;color:inherit}
.fn-card.on{border-color:#16A34A;background:#F0FDF4}
.fn-ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:#F0FDF4;flex-shrink:0;font-size:18px}
.fn-card b{display:block;font-size:14px;color:#14532D}
.fn-card small{display:block;margin-top:2px;color:#64748B;font-weight:600;font-size:12px;line-height:1.35}
.fn-tick{margin-left:auto;width:22px;height:22px;border-radius:50%;border:1.5px solid #D1D5DB;display:grid;place-items:center;color:transparent;font-size:12px;font-weight:900;flex-shrink:0}
.fn-card.on .fn-tick{background:#16A34A;border-color:#16A34A;color:#fff}
.fld input[type=range]{width:100%;accent-color:#16A34A}
.btn{width:100%;border:0;border-radius:999px;background:#16A34A;color:#fff;font-weight:800;font-size:16px;padding:14px;cursor:pointer;font:inherit;box-shadow:0 8px 18px rgba(22,163,74,.28)}
.btn.ghost{background:#fff;color:#15803D;border:1.5px solid #86EFAC;box-shadow:none}
.btn-row{display:flex;flex-direction:column;gap:10px;padding:8px 16px 16px}
.ctx{padding:0 16px 8px;font-size:13px;font-weight:700;color:#64748B}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid #D1FAE5;background:#fff;color:#166534;border-radius:999px;padding:8px 14px;font-weight:800;font-size:13px;cursor:pointer;font:inherit}
.chip.on{background:#16A34A;color:#fff;border-color:#16A34A}
.caterer{display:flex;gap:12px;width:calc(100% - 32px);margin:0 16px 12px;padding:10px;border:1px solid #E5E7EB;border-radius:18px;background:#fff;text-align:left;cursor:pointer;font:inherit;color:inherit;box-shadow:0 4px 14px rgba(15,23,42,.04)}
.caterer.unavail{opacity:.92;border-color:#FECACA;background:#FFFBFB}
.caterer.unavail .thumb{filter:grayscale(.35)}
.badge.wait{background:#FFEDD5;color:#C2410C}
.thumb{width:92px;height:92px;border-radius:14px;flex-shrink:0;display:grid;place-items:center;font-size:34px;color:#fff}
.caterer b{display:block;font-size:15px;color:#14532D}
.meta{font-size:12px;font-weight:700;color:#64748B;margin-top:3px;line-height:1.4}
.stars{color:#CA8A04;font-weight:800}
.price{margin-top:6px;font-size:13px;font-weight:900;color:#15803D}
.badge{display:inline-block;margin-top:6px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
.badge.ok{background:#DCFCE7;color:#166534}
.badge.no{background:#FEE2E2;color:#B91C1C}
.hero{height:168px;margin:0 16px 12px;border-radius:18px;display:flex;align-items:flex-end;padding:14px;color:#fff;font-size:40px;background:linear-gradient(145deg,#166534,#CA8A04)}
.rate-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 16px 8px;font-size:13px;font-weight:800}
.serves{display:inline-flex;align-items:center;gap:4px;background:#DCFCE7;color:#166534;border-radius:999px;padding:4px 8px;font-size:11px}
.tabs{display:flex;gap:18px;padding:8px 16px 0;border-bottom:1px solid #E5E7EB}
.tabs button{border:0;background:none;font:inherit;font-weight:800;color:#64748B;padding:10px 0;cursor:pointer;border-bottom:3px solid transparent}
.tabs button.on{color:#15803D;border-color:#16A34A}
.detail-tabs{margin-top:0}
.detail-tab-body{padding-bottom:16px}
.about{padding:14px 16px;font-size:14px;line-height:1.5;color:#374151;font-weight:600}
.about h3{margin:0 0 6px;font-size:14px;color:#14532D}
.spec{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 12px}
.spec span{background:#F0FDF4;color:#166534;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px}
.photo-grid div{height:110px;border-radius:14px;display:grid;place-items:center;font-size:36px;color:#fff}
.review{margin:0 16px 10px;padding:12px;border:1px solid #E5E7EB;border-radius:14px}
.review b{display:block;font-size:13px}
.review p{margin:4px 0 0;font-size:13px;color:#374151;font-weight:600;line-height:1.4}
.sticky-cta{position:sticky;bottom:0;padding:12px 16px 16px;background:linear-gradient(transparent,#fff 28%)}
.confirm{margin:0 16px 12px;padding:12px;border-radius:16px;background:#F0FDF4;border:1px solid #BBF7D0;display:flex;justify-content:space-between;gap:8px;align-items:center;cursor:pointer}
.confirm b{display:block;font-size:14px;color:#14532D}
.confirm small{color:#166534;font-weight:700}
.confirm button{border:0;background:#fff;color:#15803D;font-weight:800;border-radius:999px;padding:8px 10px;cursor:pointer;font:inherit}
.count-line{padding:0 16px 8px;font-size:12px;font-weight:700;color:#64748B}
.pkg{display:flex;gap:12px;width:calc(100% - 32px);margin:0 16px 12px;padding:10px;border:0;border-radius:18px;background:#fff;box-shadow:0 6px 18px rgba(15,23,42,.06);text-align:left;cursor:pointer;font:inherit;color:inherit;border:1px solid #E5E7EB}
.food-row{align-items:center;padding:8px 10px 8px 8px}
.food-row.on{border-color:#86EFAC;box-shadow:0 0 0 1px #BBF7D0}
.food-check{width:44px;height:44px;flex-shrink:0;border:2px solid #D1FAE5;border-radius:14px;background:#F0FDF4;color:#15803D;font-size:20px;font-weight:900;cursor:pointer;display:grid;place-items:center;padding:0}
.food-check.on{background:#16A34A;border-color:#16A34A;color:#fff}
.food-check:not(.on){font-size:22px;color:#16A34A;font-weight:800}
.food-hint{margin:-4px 16px 10px;font-size:12px;font-weight:700;color:#64748B;line-height:1.45}
.food-hint b{color:#14532D}
.food-group-h{margin:14px 16px 8px;font-size:12px;font-weight:900;letter-spacing:.02em;text-transform:uppercase;color:#166534}
.food-select-actions{display:flex;flex-direction:column;gap:8px}
.link-btn{border:0;background:none;font:inherit;font-size:13px;font-weight:800;color:#64748B;cursor:pointer;padding:4px 0;text-align:center}
.link-btn:hover{color:#14532D}
.estimate-note{margin:0 16px 12px;padding:10px 12px;border-radius:12px;background:#F0FDF4;border:1px solid #BBF7D0;font-size:12px;font-weight:700;color:#166534;line-height:1.45}
.detail-hint{margin:12px 16px 0;padding:10px 12px;border-radius:12px;background:#F8FAFC;border:1px solid #E2E8F0;font-size:12px;font-weight:700;color:#64748B;line-height:1.45}
.food-body{flex:1;display:flex;gap:12px;align-items:flex-start;border:0;background:transparent;padding:0;text-align:left;cursor:pointer;font:inherit;color:inherit;min-width:0}
.food-body .thumb{width:72px;height:72px;font-size:28px;flex-shrink:0}
#ccMenu.has-food-bar #ccMenuList{padding-bottom:132px}
.food-select-bar{position:sticky;bottom:0;margin-top:-4px;padding:10px 16px 16px;background:linear-gradient(transparent,#fff 22%);border-top:1px solid #E5E7EB;display:flex;flex-direction:column;gap:10px;z-index:5}
.food-select-bar[hidden]{display:none!important}
.food-select-meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 2px}
.food-select-meta small{font-size:12px;font-weight:800;color:#64748B}
.food-select-meta b{font-size:18px;font-weight:900;color:#15803D}
.sum-card.compact{margin-bottom:8px;padding:10px}
.sum-card.compact .thumb{width:52px;height:52px;font-size:22px}
.interest-lines{margin:0 16px 8px}
.interest-line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #F1F5F9;font-size:13px;font-weight:700}
.interest-line b{color:#14532D;font-size:14px}
.interest-line span{color:#64748B;text-align:right;line-height:1.35}
.btn.on{background:#15803D;color:#fff}
.pkg .thumb{width:84px;height:84px;font-size:32px}
.pkg-top{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lv{font-size:10px;font-weight:800;padding:3px 7px;border-radius:8px;background:#DCFCE7;color:#166534}
.lv.standard{background:#FFEDD5;color:#C2410C}
.lv.premium{background:#FEF3C7;color:#92400E}
.cat-chip{font-size:10px;font-weight:800;padding:3px 7px;border-radius:8px;background:#ECFDF5;color:#047857}
.pop{font-size:10px;font-weight:800;padding:3px 7px;border-radius:8px;background:#FEF3C7;color:#92400E}
.diet-mark{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border:1.5px solid currentColor;border-radius:3px;background:#fff;flex-shrink:0}
.diet-mark i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.diet-mark.veg{color:#14804A}
.diet-mark.non{color:#C2410C}
.diet-line{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:12px;font-weight:800;color:#0F172A}
.was{color:#94A3B8;text-decoration:line-through;font-weight:700;font-size:12px;margin-right:4px}
.off-pill{display:inline-flex;align-items:center;margin-left:4px;background:#FBCFE8;color:#BE185D;font-size:10px;font-weight:800;padding:2px 6px;border-radius:999px}
.detail-price{display:flex;justify-content:space-between;gap:8px;margin:12px 16px;padding:12px;border-radius:16px;background:#F0FDF4}
.detail-price b{display:block;font-size:18px;color:#15803D}
.detail-price span{font-size:12px;font-weight:700;color:#166534}
.slab-box{margin:0 16px 10px;padding:12px;border-radius:16px;border:1px solid #D1FAE5;background:#F8FFFB}
.slab-box-h{margin:0 0 8px;font-size:13px;font-weight:900;color:#14532D}
.slab-yours{margin:0 0 10px;padding:8px 10px;border-radius:12px;background:#ECFDF5;font-size:13px;font-weight:700;color:#166534;line-height:1.45}
.slab-yours b{color:#14532D}
.slab-list{display:flex;flex-direction:column;gap:6px}
.slab-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:#fff;border:1px solid #E5E7EB;font-size:12px;font-weight:800;color:#374151}
.slab-row span:first-child{color:#64748B;font-weight:700}
.slab-row.on{border-color:#86EFAC;background:#F0FDF4;box-shadow:0 0 0 1px #BBF7D0}
.slab-row.on span:first-child{color:#14532D;font-weight:900}
.slab-note{margin:8px 0 0;font-size:11px;font-weight:700;color:#64748B;line-height:1.4}
.menu-inc-h{margin:4px 16px 8px;font-size:13px;font-weight:900;color:#14532D}
.inc-tag{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;color:#047857;background:#ECFDF5;padding:2px 6px;border-radius:999px;vertical-align:middle}
.inc{width:calc(100% - 32px);margin:0 16px 8px;border:1px solid #E5E7EB;border-radius:14px;background:#fff;text-align:left;font:inherit;cursor:pointer;padding:12px}
.inc b{display:block;font-size:14px}
.inc small{color:#64748B;font-weight:700}
.inc ul{margin:8px 0 0;padding-left:18px}
.inc li{font-size:13px;font-weight:600;color:#374151;margin:2px 0}
.sum-card{margin:0 16px 12px;padding:12px;border-radius:16px;border:1px solid #E5E7EB;display:flex;gap:10px;align-items:center}
.sum-card .thumb{width:64px;height:64px;font-size:28px}
.kv{padding:0 16px 12px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #F1F5F9;font-size:14px;font-weight:700}
.kv span{color:#64748B}
.note{width:calc(100% - 32px);margin:0 16px 12px;min-height:96px;border:1.5px solid #D1FAE5;border-radius:14px;padding:12px;font:inherit;font-weight:600}
.sent{margin:0 16px 12px;padding:14px;border-radius:16px;background:#F0FDF4;border:1px solid #86EFAC;color:#166534;font-weight:700;line-height:1.45}
.empty{margin:24px 16px;padding:20px;text-align:center;color:#64748B;font-weight:700}
.toast{position:absolute;left:16px;right:16px;bottom:16px;background:#14532D;color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:800;display:none;z-index:120;text-align:center}
.cal-overlay{position:absolute;inset:0;background:rgba(15,23,42,.38);z-index:90;display:none;pointer-events:none;border-radius:28px}
.cal-overlay.on{display:block;pointer-events:auto}
.cal-sheet{position:absolute;left:10px;right:10px;top:36px;background:#fff;border-radius:16px;padding:8px 10px 10px;box-shadow:0 10px 28px rgba(15,23,42,.2);max-height:calc(100% - 48px);overflow:auto}
.cal-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-weight:800;color:#14532D;font-size:12px;gap:6px}
.cal-bar b{font-size:12px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-bar button{border:0;background:none;font:inherit;font-weight:800;cursor:pointer;color:#64748B;font-size:12px;padding:4px 2px;flex-shrink:0}
.cal-bar .done{color:#16A34A}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;gap:4px}
.cal-nav button{border:0;background:#F0FDF4;color:#14532D;width:28px;height:28px;border-radius:50%;font-size:16px;line-height:1;cursor:pointer;font-weight:900;flex-shrink:0}
.cal-nav b{flex:1;text-align:center;font-size:13px;color:#14532D;font-weight:800}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-grid .h{padding:2px 0;font-weight:800;color:#64748B;font-size:9px}
.cal-grid .d{padding:5px 0;border-radius:8px;cursor:pointer;font-weight:800;color:#14532D;border:0;background:transparent;font:inherit;width:100%;font-size:11px;line-height:1.2}
.cal-grid .d.off{color:#CBD5E1;pointer-events:none;background:transparent}
.cal-grid .d.on{background:#16A34A;color:#fff}
.cal-grid .d.past{opacity:.35;pointer-events:none}
</style>
</head>
<body>
<div class="stage"><div class="phone">
<div class="notch"><span>9:41</span><span>●●●</span></div>

<section class="scr on" id="ccSearch">
  <div class="banner"><b>Find Catering Services</b><span>Wedding, sadhya, and other functions</span></div>
  <div class="pad">
    <div class="fld"><label>Location / Area</label><div class="box">📍<input id="ccLocation" list="ccAreas" value="Pathanamthitta" placeholder="Town or area"></div></div>
    <datalist id="ccAreas">
      <option value="Pathanamthitta"></option>
      <option value="Pandalam"></option>
      <option value="Adoor"></option>
      <option value="Thiruvalla"></option>
      <option value="Kozhencherry"></option>
      <option value="Ranni"></option>
    </datalist>
    <div class="fld"><label>Event Date</label><div class="box date-box" id="ccDateBox"><span aria-hidden="true">📅</span><span id="ccDateLabel" class="date-readout">Tue, 15 Dec 2026</span><button type="button" class="date-open" id="ccDateOpen">Select date</button><input id="ccDate" type="date" class="date-native" value="2026-12-15" aria-label="Event date"></div></div>
    <div class="fld"><label>Number of Guests</label><div class="box">👥<input id="ccGuests" type="number" min="1" value="300"></div></div>
    <p class="fld" style="margin-bottom:8px"><label>What type of function? <span class="opt">(Optional)</span></label></p>
    <div id="ccFunctions"></div>
    <div class="fld">
      <label>Expected Budget per Plate <span class="opt">(Optional)</span></label>
      <div class="budget-sliders">
        <div class="dual-range" id="ccBudgetDual">
          <div class="dual-range-track" aria-hidden="true"><span id="ccBudgetFill"></span></div>
          <input id="ccBudgetMin" type="range" min="0" max="3000" step="10" value="0" aria-label="Minimum budget per plate">
          <input id="ccBudgetMax" type="range" min="0" max="3000" step="10" value="300" aria-label="Maximum budget per plate">
        </div>
        <div class="range-ends"><span>₹ 0</span><span>₹ 3,000</span></div>
      </div>
      <div class="budget-val" id="ccBudgetRangeVal">₹0 to ₹300 per plate</div>
    </div>
  </div>
  <div class="pad" style="padding-bottom:16px"><button type="button" class="btn" id="ccSearchBtn">Search Caterers</button></div>
</section>

<section class="scr" id="ccResults">
  <div class="top"><button type="button" class="back" id="ccResultsBack">←</button><h1 id="ccResultsTitle">Catering Services</h1><span style="width:36px"></span></div>
  <p class="ctx" id="ccResultsCtx"></p>
  <div id="ccResultList"></div>
</section>

<section class="scr" id="ccProfile">

function foodMasterKey(moduleId, subcatId, name) {
  return moduleId + '::' + subcatId + '::' + String(name || '').toLowerCase().replace(/\s+/g, '-');

function inferCatalogDiet(subcatName, itemName) {
  const sc = String(subcatName || '').toLowerCase();
  const nm = String(itemName || '').toLowerCase();
  const meat = /\b(chicken|mutton|beef|prawn|fish|crab|lobster|squid|calamari|seafood|chemmeen|duck|pork|meen)\b/;
  if (/\begg\b/.test(nm) && !/vegetable/.test(nm)) return 'non_veg';
  if (meat.test(nm)) return 'non_veg';
  if (/\b(rice|biryani|biriyani)\b/.test(nm)) return 'veg';
  if (
    sc.indexOf('non-vegetarian') >= 0 ||
    sc.indexOf('non vegetarian') >= 0 ||
    sc.indexOf('chicken & meat') >= 0 ||
    sc.indexOf('chicken, meat') >= 0 ||
    sc.indexOf('chicken dishes') >= 0 ||
    sc.indexOf('mutton') >= 0 ||
    sc.indexOf('beef') >= 0 ||
    sc.indexOf('duck') >= 0 ||
    sc.indexOf('pork') >= 0 ||
    sc.indexOf('fish & seafood') >= 0 ||
    sc.indexOf('seafood') >= 0 ||
    sc.indexOf('grill') >= 0
  ) {
    return 'non_veg';
  }
  if (sc.indexOf('paneer & egg') >= 0 && /\begg\b/.test(nm)) return 'non_veg';
  return 'veg';
}

function buildFoodModules() {
  return CATERING_CATALOG_DEFS.map(function (m, idx) {
    const subcats = (m.subcats || []).map(function (sc) {
      const items = (sc.items || []).map(function (name) {
        const diet = inferCatalogDiet(sc.name, name);
        return {
          masterKey: foodMasterKey(m.id, sc.id, name),
          name: name,
          subcatId: sc.id,
          subcatName: sc.name,
          diet: diet,
        };
      });
      return { id: sc.id, name: sc.name, items: items };
    });
    return {
      id: m.id,
      num: idx + 1,
      name: m.name,
      emoji: m.emoji,
      gradient: FOOD_MODULE_GRADIENTS[idx] || FOOD_MODULE_GRADIENTS[0],
      subcats: subcats,
    };
  });
}

const FOOD_MODULES = buildFoodModules();

function findFoodModule(moduleId) {
  return FOOD_MODULES.find(function (m) {
    return m.id === moduleId;
  });
}

function findMasterItem(masterKey) {
  for (let mi = 0; mi < FOOD_MODULES.length; mi++) {
    const mod = FOOD_MODULES[mi];
    for (let si = 0; si < mod.subcats.length; si++) {
      const sc = mod.subcats[si];
      for (let ii = 0; ii < sc.items.length; ii++) {
        if (sc.items[ii].masterKey === masterKey) return { module: mod, subcat: sc, item: sc.items[ii] };
      }
    }
  }
  return null;
}

function ccPackageServeStyle(p) {
  p = p || {};
  if (p.serveStyle === 'table' || p.serveStyle === 'buffet' || p.serveStyle === 'both') return p.serveStyle;
  if (p.serveAtTable && p.serveAtCounter) return 'both';
  if (p.serveAtCounter) return 'buffet';
  if (p.serveAtTable) return 'table';
  const legacy = p.menuStyle || '';
  if (legacy === 'sadhya') return 'table';
  if (legacy === 'buffet' || legacy === 'arabian') return 'buffet';
  return '';
}

function ccServeStyleLabel(id) {
  if (id === 'table') return 'Table service';
  if (id === 'buffet') return 'Buffet';
  if (id === 'both') return 'Table & buffet';
  return '';
}

function ccServeFilterLabel(id) {
  const hit = CC_SERVE_FILTERS.filter(function (s) {

}

function ccMenuGroupsForPackage(pkg) {
  if (!pkg) return [];
  if (pkg.groups && pkg.groups.length) return pkg.groups;
  if (pkg.menuModules && pkg.menuModules.length) {
    return pkg.menuModules.map(function (row) {
      const mod = typeof findFoodModule === 'function' ? findFoodModule(row.moduleId) : null;
      return { name: (mod && mod.name) || String(row.moduleId || 'Menu'), items: row.items || [] };
    });
  }
  return [];
}

function el(id) {
  return document.getElementById(id);
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function show(id) {
  document.querySelectorAll('.scr').forEach(function (s) {
    s.classList.toggle('on', s.id === id);
  });
  const scr = el(id);
  if (scr) scr.scrollTop = 0;
}
function toast(m) {
  const t = el('ccToast');
  if (!t) return;
  t.textContent = m;
  t.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(function () {
    t.style.display = 'none';
  }, 2400);
}
function inr(n) {
  return '₹' + Math.max(0, Math.round(+n || 0)).toLocaleString('en-IN');
}
function formatWhen(iso) {

  el('ccMenuTitle').textContent = c.name;
  const foodTotal = (c.foods || []).length;
  const selN = (state.selectedFoodIds || []).length;
  let foodTabLabel =
    foodTotal > 0 ? 'Individual Food Items (' + foodTotal + ')' : 'Individual Food Items';
  if (selN > 0) foodTabLabel = 'Individual Food Items · ' + selN + ' selected';
  el('ccTabPackages').classList.toggle('on', state.menuTab === 'packages');
  el('ccTabFood').classList.toggle('on', state.menuTab === 'food');
  el('ccTabFood').textContent = foodTabLabel;
  const foodHint = el('ccMenuFoodHint');
  const pkgHint = el('ccMenuPackageHint');
  if (foodHint) foodHint.hidden = state.menuTab !== 'food';
  if (pkgHint) pkgHint.hidden = state.menuTab !== 'packages';
  if (foodHint && state.menuTab === 'food') {
    foodHint.innerHTML =
      'Dishes follow the caterer library (drinks, rice, curries, and so on). Tick <b>+</b> to add <b>more than one</b>. A full menu is one <b>Package</b>. Prices are <b>per plate × ' +
      state.guests +
      ' guests</b> (estimate only).';
  }
  if (pkgHint && state.menuTab === 'packages') {
    pkgHint.innerHTML =
      'Choose <b>one</b> package (table service, buffet, or both). Packages are not combined. Extra dishes go under <b>Individual Food Items</b>.';
  }
  el('ccWhenLabel').textContent = formatWhen(state.date) + ' · ' + state.guests + ' guests';
  const fnLabel = state.functionType === 'other' ? 'Other Functions' : state.functionType === 'wedding' ? 'Wedding & Related' : 'all functions';
  renderMenuDietChips();
  if (state.menuTab === 'food') {
    el('ccMenuChips').innerHTML = '';
    const foods = foodsFor(c);
    const dietNote =
      state.menuDietFilter === 'veg'
        ? ' · Veg only'
        : state.menuDietFilter === 'non_veg'
          ? ' · Non veg only'
          : '';
    el('ccMenuCount').textContent = foods.length + ' dishes' + dietNote;
    el('ccMenuList').innerHTML = foods.length
      ? ccCustomerFoodGroups().map(function (g) {
          const rows = foods.filter(function (f) {
            return ccFoodModuleId(f) === g.id;
          });
          if (!rows.length) return '';
          return (
            '<p class="food-group-h">' +
            esc(g.label) +
            '</p>' +
            rows
              .map(function (f) {
                const q = plateOf(f, state.guests);
                const picked = isFoodSelected(f.id);
                return (
                  '<div class="pkg food-row' +
                  (picked ? ' on' : '') +
                  '"><button type="button" class="food-check' +
                  (picked ? ' on' : '') +
                  '" data-toggle-food="' +
                  esc(f.id) +
                  '" aria-pressed="' +
                  picked +
                  '" aria-label="' +
                  (picked ? 'Remove' : 'Select') +
                  ' ' +
                  esc(f.name) +
                  '">' +
                  (picked ? '✓' : '+') +
                  '</button><button type="button" class="food-body" data-food="' +
                  esc(f.id) +
                  '"><span class="thumb" style="background:' +
                  c.color +
                  '">' +
                  f.emoji +
                  '</span><span><b>' +
                  esc(f.name) +
                  '</b>' +
                  dietHtml(f.dietType) +
                  '<p class="meta" style="margin-top:4px">' +
                  esc(f.description || '') +
                  '</p><div class="price">' +
                  priceHtml(q) +
                  '</div></span></button></div>'
                );
              })
              .join('')
          );
        }).join('')
      : '<div class="empty">No individual dishes match this diet filter. Try <b>All</b> or check the Packages tab.</div>';
  } else {
    el('ccMenuChips').innerHTML = CC_SERVE_FILTERS.map(function (s) {
      return (
        '<button type="button" class="chip' +
        (state.serveFilter === s.id ? ' on' : '') +
        '" data-serve="' +
        s.id +
        '">' +
        esc(s.label) +
        '</button>'
      );
    }).join('');
    const packs = packagesFor(c, { serve: state.serveFilter, diet: state.menuDietFilter });
    const dietNote =
      state.menuDietFilter === 'veg'
        ? ' · Veg only'
        : state.menuDietFilter === 'mixed'
          ? ' · Veg & Non-veg'
          : '';
    const styleNote = state.serveFilter === 'all' ? '' : ' · ' + ccServeFilterLabel(state.serveFilter);
    el('ccMenuCount').textContent = 'Showing ' + packs.length + ' packages for ' + fnLabel + styleNote + dietNote;
    el('ccMenuList').innerHTML = packs.length
      ? packs
          .map(function (p) {
            const q = plateOf(p, state.guests);
            return (
              '<button type="button" class="pkg" data-pkg="' +
              esc(p.id) +
              '"><span class="thumb" style="background:' +
              c.color +
              '">🍛</span><span><span class="pkg-top"><span class="lv ' +
              esc(p.level.toLowerCase()) +
              '">' +
              esc(p.level) +
              '</span><span class="cat-chip">' +
              esc(ccServeStyleLabel(ccPackageServeStyle(p)) || 'Service') +
              '</span><span class="cat-chip">' +
              (p.category === 'wedding' ? 'Wedding & Related' : 'Other Functions') +
              '</span>' +
              (p.popular ? '<span class="pop">Most Popular</span>' : '') +
              '</span><b>' +
              esc(p.name) +
              '</b>' +
              dietHtml(p.dietType) +
              '<div class="price">' +
              priceHtml(q) +
              '</div></span></button>'
            );
          })
          .join('')
      : '<div class="empty">No packages for this filter.</div>';
  }
  renderFoodSelectBar();
  el('ccMenuChips').querySelectorAll('[data-serve]').forEach(function (btn) {
    btn.onclick = function () {
      state.serveFilter = btn.getAttribute('data-serve') || 'all';
      renderMenu();
    };
  });
  el('ccMenuList').querySelectorAll('[data-pkg]').forEach(function (btn) {
    btn.onclick = function () {
      openDetail('package', btn.getAttribute('data-pkg'));
    };
  });
  el('ccMenuList').querySelectorAll('[data-toggle-food]').forEach(function (btn) {
    btn.onclick = function (e) {
      e.preventDefault();
      e.stopPropagation();
      toggleFoodSelection(btn.getAttribute('data-toggle-food'));
      renderMenu();
    };
  });
  el('ccMenuList').querySelectorAll('[data-food]').forEach(function (btn) {
    btn.onclick = function () {
      openDetail('food', btn.getAttribute('data-food'));
    };
  });
}

function findSelection(kind, id) {
  const c = catererById(state.catererId);
  if (!c) return null;
  const list = kind === 'food' ? c.foods : c.packages;
  const item = (list || []).filter(function (x) {
    return x.id === id;
  })[0];
  return item ? { caterer: c, kind: kind, item: item } : null;
}
function openDetail(kind, id) {
  state.selection = findSelection(kind, id);
  state.openGroup = '';
  state.detailTab = 'menu';
  if (!state.selection) return;
  renderDetail();
  show('ccDetail');
}
function renderDetail() {
  const sel = state.selection;
  if (!sel) return;
  const item = sel.item;
  const q = plateOf(item, state.guests);
  const total = q.offer * state.guests;
  el('ccDetailTitle').textContent = item.name;
  let html = '<div class="hero" style="background:' + sel.caterer.color + '">' + (item.emoji || '🍛') + '</div>';
  html += '<div class="pad"><span class="pkg-top"><span class="lv ' + esc(String(item.level || 'basic').toLowerCase()) + '">' + esc(item.level || 'Dish') + '</span>';
  if (item.category) {
    html += '<span class="cat-chip">' + esc(ccServeStyleLabel(ccPackageServeStyle(item)) || 'Service') + '</span>';
    html += '<span class="cat-chip">' + (item.category === 'wedding' ? 'Wedding & Related' : 'Other Functions') + '</span>';
  }
  html += '</span><h2 style="margin:8px 0 0;font-size:20px;color:#14532D">' + esc(item.name) + '</h2>';
  html += dietHtml(item.dietType);
  html += '<p class="meta">' + esc(item.blurb || item.description || '') + '</p></div>';
  html +=
    '<div class="detail-price"><div><span>Price for ' +
    state.guests +
    ' guests</span><b>' +
    priceHtml(q) +
    '</b></div><div style="text-align:right"><span>Estimated total</span><b>' +
    inr(total) +
    '</b></div></div>';
  const menuGroups = sel.kind === 'package' ? ccMenuGroupsForPackage(item) : item.groups || [];
  const hasMenuGroups = !!(menuGroups && menuGroups.length);
  html +=
    '<div class="tabs detail-tabs"><button type="button" data-dtab="menu"' +
    (state.detailTab === 'menu' ? ' class="on"' : '') +
    '>' +
    (hasMenuGroups ? 'Menu inclusions' : 'About') +
    '</button><button type="button" data-dtab="pricing"' +
    (state.detailTab === 'pricing' ? ' class="on"' : '') +
    '>Per plate pricing</button></div>';
  html += '<div class="detail-tab-body">';
  if (state.detailTab === 'pricing') {
    html += renderDetailSlabSection(item, state.guests);
  } else if (hasMenuGroups) {
    html += '<p class="menu-inc-h">What&apos;s included <span class="inc-tag">Included in per plate price</span></p>';
    html += menuGroups
      .map(function (g) {
        const open = state.openGroup === g.name;
        return (
          '<button type="button" class="inc" data-g="' +
          esc(g.name) +
          '"><b>' +
          esc(g.name) +
          '</b><small> (' +
          g.items.length +
          ')</small>' +
          (open ? '<ul>' + g.items.map(function (d) { return '<li>' + esc(d) + '</li>'; }).join('') + '</ul>' : '') +
          '</button>'
        );
      })
      .join('');
  } else if (sel.kind === 'food') {
    html +=
      '<div class="detail-about pad" style="padding-top:12px"><p class="meta" style="margin:0;line-height:1.5">' +
      esc(item.description || item.blurb || 'Single dish pricing — see the Per plate pricing tab for your guest count.') +
      '</p></div>';
  } else {
    html += '<p class="empty" style="margin-top:16px">No menu breakdown for this item.</p>';
  }
  html += '</div>';
  if (sel.kind === 'food') {
    const n = (state.selectedFoodIds || []).length;
    html +=
      '<p class="detail-hint">' +
      (isFoodSelected(item.id)
        ? 'This dish is in your selection. Tap <b>Added</b> to remove, or continue with all selected dishes below.'
        : n
          ? 'Tap <b>Add to selection</b>, or review your ' + n + ' selected dish' + (n === 1 ? '' : 'es') + ' from the menu bar.'
          : 'Tap <b>Add to selection</b>, or tick <b>+</b> on the list. Prices use your guest count from search.') +
      '</p>';
  }
  el('ccDetailBody').innerHTML = html;
  el('ccDetailBody').querySelectorAll('[data-dtab]').forEach(function (btn) {
    btn.onclick = function () {
      state.detailTab = btn.getAttribute('data-dtab') || 'menu';
      renderDetail();
    };
  });
  el('ccDetailBody').querySelectorAll('[data-g]').forEach(function (btn) {
    btn.onclick = function () {
      const name = btn.getAttribute('data-g');
      state.openGroup = state.openGroup === name ? '' : name;
      renderDetail();
    };
  });
  updateDetailActions();
}
function updateDetailActions() {
  const sel = state.selection;
  const init = el('ccInitiate');
  const cust = el('ccCustomise');
  if (!init || !cust || !sel) return;
  if (sel.kind === 'food') {
    const on = isFoodSelected(sel.item.id);
    const n = (state.selectedFoodIds || []).length;
    init.textContent = on ? 'Added · Tap to remove' : 'Add to selection';
    init.classList.toggle('on', on);
    cust.textContent = n ? 'Continue with ' + n + (n === 1 ? ' dish' : ' dishes') : '';
    cust.style.display = n ? '' : 'none';
  } else {
    init.textContent = 'Initiate Interest';
    init.classList.remove('on');
    cust.textContent = 'Customise Requirement';
    cust.style.display = '';
  }
}

function openFoodMultiInterest(fromCustomise) {
  const c = catererById(state.catererId);
  if (!c) return;
  const items = selectedFoodItemsForCaterer(c);
  if (!items.length) {
    toast('Select at least one dish');
    return;
  }
  if (!c.available) {
    toast('This caterer is unavailable on ' + formatWhen(state.date));
    return;
  }
  state.selection = { caterer: c, kind: 'food_multi', items: items };
  state.showCustomRequirements = true;
  if (!fromCustomise) state.note = '';
  state.sent = false;
  renderInterest();
  show('ccInterest');
  if (fromCustomise) {
    const note = el('ccNote');
    if (note) note.focus();
  }
}

function openInterest(fromCustomise) {
  if (!state.selection) return;
  const c = state.selection.caterer;
  if (!c.available) {
    toast('This caterer is unavailable on ' + formatWhen(state.date));
    return;
  }
  state.showCustomRequirements = !!fromCustomise;
  if (!fromCustomise) state.note = '';
  state.sent = false;
  renderInterest();
  show('ccInterest');
  if (fromCustomise) {
    const note = el('ccNote');
    if (note) note.focus();
  }
}
function renderInterest() {
  const sel = state.selection;
  if (!sel) return;
  let html = '';
  if (sel.kind === 'food_multi') {
    const items = sel.items || [];
    html +=
      '<p class="ctx" style="margin-top:8px">Individual dishes · ' +
      items.length +
      ' selected for ' +
      state.guests +
      ' guests</p><div class="interest-lines">';
    let grand = 0;
    items.forEach(function (item) {
      const q = plateOf(item, state.guests);
      const line = q.offer * state.guests;
      grand += line;
      html +=
        '<div class="interest-line"><span><b>' +
        esc(item.emoji || '🍽') +
        ' ' +
        esc(item.name) +
        '</b><br>' +
        priceHtml(q) +
        '</span><span>Line total<br><b style="color:#15803D">' +
        inr(line) +
        '</b></span></div>';
    });
    html +=
      '</div><div class="kv"><div><span>Event Date</span><b>' +
      esc(formatWhen(state.date)) +
      '</b></div><div><span>Number of Guests</span><b>' +
      state.guests +
      '</b></div><div><span>Event Location</span><b>' +
      esc(state.location) +
      '</b></div><div><span>Estimated total</span><b>' +
      inr(grand) +
      '</b></div></div>';
    html +=
      '<p class="estimate-note">This total adds each selected dish at its per-plate rate for ' +
      state.guests +
      ' guests. The caterer confirms the final quote — sending interest does not book the event.</p>';
    html +=
      '<p class="pad" style="font-weight:800;color:#14532D;margin-bottom:8px">Additional Requirements (Optional)</p>' +
      '<textarea class="note" id="ccNote" maxlength="500" placeholder="Eg. service time, quantity tweaks, combo with a package, etc.">' +
      esc(state.note) +
      '</textarea>';
  } else {
  const item = sel.item;
  const q = plateOf(item, state.guests);
  const cat = item.category === 'other' ? 'Other Functions' : item.category === 'wedding' ? 'Wedding & Related' : 'Individual dish';
  html =
    '<div class="sum-card"><span class="thumb" style="background:' +
    sel.caterer.color +
    '">' +
    (item.emoji || '🍛') +
    '</span><span><b>' +
    esc(item.name) +
    '</b><div class="meta">' +
    esc(item.level || 'Dish') +
    ' · ' +
    cat +
    '</div><div class="price">' +
    priceHtml(q) +
    '</div></span></div>' +
    '<div class="kv"><div><span>Event Date</span><b>' +
    esc(formatWhen(state.date)) +
    '</b></div><div><span>Number of Guests</span><b>' +
    state.guests +
    '</b></div><div><span>Event Location</span><b>' +
    esc(state.location) +
    '</b></div><div><span>Estimated total</span><b>' +
    inr(q.offer * state.guests) +
    '</b></div></div>';
  if (state.showCustomRequirements) {
    html +=
      '<p class="pad" style="font-weight:800;color:#14532D;margin-bottom:8px">Additional Requirements (Optional)</p>' +
      '<textarea class="note" id="ccNote" maxlength="500" placeholder="Eg. Live counter, special menu, service time, etc.">' +
      esc(state.note) +
      '</textarea>';
  }
  }
  if (state.sent) {
    html +=
      '<div class="sent">Interest sent to ' +
      esc(sel.caterer.name) +
      '. They will reply to discuss the menu. This does not confirm the booking.</div>';
  }
  el('ccInterestBody').innerHTML = html;
  const note = el('ccNote');
  if (note) {
    note.oninput = function () {
      state.note = note.value;
    };
  }
  const send = el('ccSend');
  if (send) {
    send.disabled = state.sent;
    send.textContent = state.sent ? 'Interest sent' : 'Send Interest';
  }
}

function bootCustomer() {
  renderSearchBits();
  const minEl = el('ccBudgetMin');
  const maxEl = el('ccBudgetMax');
  if (minEl) {
    minEl.oninput = function () {
      syncBudgetFromInputs(true);
    };
    minEl.onchange = minEl.oninput;
  }
  if (maxEl) {
    maxEl.oninput = function () {
      syncBudgetFromInputs(true);
    };
    maxEl.onchange = maxEl.oninput;
  }
  const dateBox = el('ccDateBox');
  const dateOpen = el('ccDateOpen');
  if (dateBox) {
    dateBox.onclick = function (e) {
      if (e.target === dateOpen || (dateOpen && dateOpen.contains(e.target))) return;
      openCustomerCalendar();
    };
  }
  if (dateOpen) {
    dateOpen.onclick = function (e) {
      e.stopPropagation();
      openCustomerCalendar();
    };
  }
  const calCancel = el('ccCalCancel');
  const calDone = el('ccCalDone');
  const calPrev = el('ccCalPrev');
  const calNext = el('ccCalNext');
  const calOverlay = el('ccCalOverlay');
  if (calCancel) calCancel.onclick = closeCustomerCalendar;
  if (calDone) calDone.onclick = applyCustomerCalendar;
  if (calPrev) calPrev.onclick = function () {
    shiftCalMonth(-1);
  };
  if (calNext) calNext.onclick = function () {
    shiftCalMonth(1);
  };
  if (calOverlay) {
    calOverlay.onclick = function (e) {
      if (e.target === calOverlay) closeCustomerCalendar();
    };
    const sheet = calOverlay.querySelector('.cal-sheet');
    if (sheet) {
      sheet.onclick = function (e) {
        e.stopPropagation();
      };
    }
  }
  const dateConfirm = el('ccDateConfirm');
  if (dateConfirm) {
    dateConfirm.onclick = function () {
      openCustomerCalendar();
    };
  }
  el('ccSearchBtn').onclick = function () {
    readSearch();
    if (!state.location) {
      toast('Enter a location');
      return;
    }
    if (!state.date) {
      toast('Choose the event date');
      return;
    }
    if (!state.guests) {
      toast('Enter the number of guests');
      return;
    }
    state.menuDietFilter = 'all';
    clearFoodSelection();
    renderResults();
    show('ccResults');
  };
  el('ccResultsBack').onclick = function () {
    show('ccSearch');
  };
  el('ccProfileBack').onclick = function () {
    show('ccResults');
  };
  el('ccSave').onclick = function () {
    if (!state.catererId) return;
    state.saved[state.catererId] = !state.saved[state.catererId];
    renderProfile();
  };
  el('ccShowMenu').onclick = function () {
    openMenu();
  };
  el('ccMenuBack').onclick = function () {
    show('ccProfile');
  };
  el('ccTabPackages').onclick = function () {
    state.menuTab = 'packages';
    normalizeMenuDietFilterForTab();
    renderMenu();
  };
  el('ccTabFood').onclick = function () {
    state.menuTab = 'food';
    normalizeMenuDietFilterForTab();
    renderMenu();
  };
  el('ccChangeDate').onclick = function (e) {
    e.stopPropagation();
    openCustomerCalendar();
  };
  el('ccDetailBack').onclick = function () {
    renderMenu();
    show('ccMenu');
  };
  el('ccCustomise').onclick = function () {
    const sel = state.selection;
    if (sel && sel.kind === 'food') {
      openFoodMultiInterest(true);
      return;
    }
    openInterest(true);
  };
  el('ccInitiate').onclick = function () {
    const sel = state.selection;
    if (sel && sel.kind === 'food') {
      toggleFoodSelection(sel.item.id);
      updateDetailActions();
      return;
    }
    openInterest(false);
  };
  el('ccInterestBack').onclick = function () {
    if (state.selection && state.selection.kind === 'food_multi') {
      renderMenu();
      show('ccMenu');
    } else show('ccDetail');
  };
  const foodReviewBtn = el('ccFoodReviewBtn');
  if (foodReviewBtn) {
    foodReviewBtn.onclick = function () {
      openFoodMultiInterest(false);
    };
  }
  const foodClearBtn = el('ccFoodClearBtn');
  if (foodClearBtn) {
    foodClearBtn.onclick = function () {
      clearFoodSelection();
      renderMenu();
      toast('Selection cleared');
    };
  }
  el('ccSend').onclick = function () {
    if (!state.selection || state.sent) return;
    if (!state.selection.caterer.available) {
      toast('This caterer is unavailable on this date');
      return;
    }
    const note = el('ccNote');
    state.note = note ? note.value : state.showCustomRequirements ? state.note : '';
    state.sent = true;
    const wasMulti = state.selection.kind === 'food_multi';
    renderInterest();
    if (wasMulti) clearFoodSelection();
    toast(wasMulti ? 'Interest sent · selection cleared' : 'Interest sent');
  };
  show('ccSearch');
}

function startCustomer() {
  if (startCustomer.done || !document.getElementById('ccSearchBtn')) return;
  startCustomer.done = true;
  bootCustomer();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', startCustomer);
startCustomer();

</script>
<!-- APP_END -->
</body>
</html>
